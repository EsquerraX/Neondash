  <style>
    :root {
      --bg: #070812;
      --surface: #111428;
      --surface-2: #191e3a;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #00f0ff;
      --secondary: #ff2ea6;
      --gold: #ffe14d;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;overscroll-behavior:none;
      background: #03040a;
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden !important;overscroll-behavior:none;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .font-display {
      font-family: 'Orbitron', system-ui, sans-serif;
      letter-spacing: 0.04em;
    }

    .app-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .app-main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }

    .app-main.game-mode {
      overflow: hidden;
      padding: 8px 12px 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.1s ease, opacity 0.15s ease, background 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #070c14;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(0, 240, 255, 0.22);
    }

    .btn-outline {
      width: 100%;
      padding: 13px 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--line);
    }

    .canvas-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #050614;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#gameCanvas{will-change:transform;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay-layer {
      position: absolute;
      inset: 0;
      background: rgba(5, 6, 18, 0.84);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      z-index: 25;
      overflow-y: auto;
    }

    .modal-global {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 14, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .toast-banner {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 390px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(17, 20, 40, 0.96);
      border: 1px solid var(--accent);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 60;
      pointer-events: none;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .anim-floaty {
      animation: floaty 2.8s ease-in-out infinite;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--line);
    }

    .tab-btn {
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--muted);
      background: transparent;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #070c14;
    }

    .switch-btn {
      width: 50px;
      height: 28px;
      border-radius: 999px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      transition: background 0.2s ease;
    }

    .switch-btn.on {
      background: var(--accent);
    }

    .switch-knob {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
    }

    .switch-btn.on .switch-knob {
      transform: translateX(22px);
      background: #070c14;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.42);
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }
  </style>
</head>

      function drawShipShape(ctx, skin, flameLen) {
        const shape = skin.shape || "interceptor";

        // 1. Propulsor trasero según silueta
        ctx.fillStyle = skin.thruster;
        if (shape === "twin_wing" || shape === "cruiser") {
          // Doble propulsor
          ctx.beginPath();
          ctx.moveTo(-15, -10);
          ctx.lineTo(-15 - flameLen * 0.9, -6);
          ctx.lineTo(-15, -2);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(-15, 2);
          ctx.lineTo(-15 - flameLen * 0.9, 6);
          ctx.lineTo(-15, 10);
          ctx.closePath();
          ctx.fill();
        } else if (shape === "phoenix") {
          // Triple pluma de fuego
          ctx.beginPath();
          ctx.moveTo(-15, -8);
          ctx.lineTo(-16 - flameLen * 1.15, 0);
          ctx.lineTo(-15, 8);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(-15, -6);
          ctx.lineTo(-16 - flameLen, 0);
          ctx.lineTo(-15, 6);
          ctx.closePath();
          ctx.fill();
        }

        // 2. Fuselaje distintivo por cada una de las 8 skins
        ctx.fillStyle = skin.body;
        ctx.beginPath();

        if (shape === "interceptor") {
          // Clásico Cian: Flecha delta equilibrada
          ctx.moveTo(-16, -13);
          ctx.lineTo(18, 0);
          ctx.lineTo(-16, 13);
          ctx.lineTo(-10, 0);
        } else if (shape === "twin_wing") {
          // Neón Eléctrico: Doble ala partida con puntas afiladas
          ctx.moveTo(-16, -15);
          ctx.lineTo(8, -6);
          ctx.lineTo(19, 0);
          ctx.lineTo(8, 6);
          ctx.lineTo(-16, 15);
          ctx.lineTo(-9, 6);
          ctx.lineTo(-13, 0);
          ctx.lineTo(-9, -6);
        } else if (shape === "needle") {
          // Neón Lima-Magenta: Lanza supersónica larga y estrecha
          ctx.moveTo(-18, -9);
          ctx.lineTo(-4, -6);
          ctx.lineTo(22, 0);
          ctx.lineTo(-4, 6);
          ctx.lineTo(-18, 9);
          ctx.lineTo(-12, 0);
        } else if (shape === "stealth") {
          // Fantasma Violeta: Ala volante tipo bombardero furtivo B-2
          ctx.moveTo(-12, -16);
          ctx.lineTo(17, 0);
          ctx.lineTo(-12, 16);
          ctx.lineTo(-6, 9);
          ctx.lineTo(-15, 4);
          ctx.lineTo(-10, 0);
          ctx.lineTo(-15, -4);
          ctx.lineTo(-6, -9);
        } else if (shape === "phoenix") {
          // Fuego Solar: Tridente con alas curvas hacia adelante
          ctx.moveTo(-15, -15);
          ctx.lineTo(6, -11);
          ctx.lineTo(0, -5);
          ctx.lineTo(20, 0);
          ctx.lineTo(0, 5);
          ctx.lineTo(6, 11);
          ctx.lineTo(-15, 15);
          ctx.lineTo(-9, 0);
        } else if (shape === "vortex") {
          // Menta Eléctrica: Alas invertidas hacia adelante (forward-swept)
          ctx.moveTo(-8, -6);
          ctx.lineTo(7, -15);
          ctx.lineTo(2, -4);
          ctx.lineTo(19, 0);
          ctx.lineTo(2, 4);
          ctx.lineTo(7, 15);
          ctx.lineTo(-8, 6);
          ctx.lineTo(-16, 10);
          ctx.lineTo(-13, 0);
          ctx.lineTo(-16, -10);
        } else if (shape === "cruiser") {
          // Tormenta Azul: Acorazado hexagonal blindado
          ctx.moveTo(-16, -12);
          ctx.lineTo(4, -12);
          ctx.lineTo(19, -4);
          ctx.lineTo(19, 4);
          ctx.lineTo(4, 12);
          ctx.lineTo(-16, 12);
          ctx.lineTo(-12, 0);
        } else {
          // Oro Leyenda: Corona Imperial de 3 puntas frontales
          ctx.moveTo(-16, -14);
          ctx.lineTo(11, -11);
          ctx.lineTo(6, -5);
          ctx.lineTo(21, 0);
          ctx.lineTo(6, 5);
          ctx.lineTo(11, 11);
          ctx.lineTo(-16, 14);
          ctx.lineTo(-10, 0);
        }

        ctx.closePath();
        ctx.fill();

        // 3. Borde de detalle / alerones de contraste
        ctx.strokeStyle = skin.trim;
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // 4. Cabina y visor
        ctx.fillStyle = skin.cockpit;
        ctx.beginPath();
        ctx.moveTo(-4, -5.5);
        ctx.lineTo(10, 0);
        ctx.lineTo(-4, 5.5);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = skin.visor;
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-1, -2.5);
        ctx.lineTo(7, 0);
        ctx.stroke();
      }

            equippedSkin: "default",

          stats: {
            gamesPlayed: 0,
            totalScore: 0,
            bestRunDistance: 0,
            totalCoinsEarned: 25
          },
          missions: createDefaultMissions()
        };

        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          const mergedSettings = { ...fallback.settings, ...(parsed.settings || {}) };
          if (!Array.isArray(mergedSettings.unlockedSkins) || !mergedSettings.unlockedSkins.length) {
            mergedSettings.unlockedSkins = ["default"];
          }
          if (!mergedSettings.unlockedSkins.includes(mergedSettings.equippedSkin)) {
            mergedSettings.equippedSkin = "default";
          }
          if (!Array.isArray(mergedSettings.unlockedThemes) || !mergedSettings.unlockedThemes.length) {
            mergedSettings.unlockedThemes = ["neon_nocturno"];
          }
          if (!mergedSettings.unlockedThemes.includes(mergedSettings.equippedTheme)) {
            mergedSettings.equippedTheme = "neon_nocturno";
          }
          if (!Array.isArray(mergedSettings.unlockedMusic) || !mergedSettings.unlockedMusic.length) mergedSettings.unlockedMusic = ["neon_base"];
          if (!mergedSettings.unlockedMusic.includes(mergedSettings.equippedMusic)) mergedSettings.equippedMusic = "neon_base";
          if (!Array.isArray(mergedSettings.unlockedTrails) || !mergedSettings.unlockedTrails.length) mergedSettings.unlockedTrails = ["sin_estela"];
          if (!mergedSettings.unlockedTrails.includes(mergedSettings.equippedTrail)) mergedSettings.equippedTrail = "sin_estela";
          mergedSettings.randomSkin = !!mergedSettings.randomSkin; mergedSettings.randomTheme = !!mergedSettings.randomTheme;
          mergedSettings.randomMusic = !!mergedSettings.randomMusic; mergedSettings.randomTrail = !!mergedSettings.randomTrail;

          return {
            settings: mergedSettings,

        } catch (err) {

      // =========================================================================
      // 5. MOTOR DE AUDIO SYNTHWAVE PROCEDURAL (WEB AUDIO API) + HÁPTICA
      // =========================================================================
      const soundEngine = {
        ctx: null,
        isPlaying: false,
        stepTimer: null,
        step: 0,
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
        },
        getGain() {
          return Math.max(0, Math.min(1, (appData.settings.volume || 0) / 100));
        },
        musicBus: null, musicFilter: null,
        ensureMusicBus() {
          if (!this.ctx) return;
          if (!this.musicBus) {
            this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.9;
            this.musicFilter = this.ctx.createBiquadFilter(); this.musicFilter.type = "lowpass"; this.musicFilter.frequency.value = 2200;
            this.musicBus.connect(this.musicFilter); this.musicFilter.connect(this.ctx.destination);
          }
        },
        playTone(freq, type, duration, volMult, slideFreq, delay) {
          if (!appData.settings.sfx) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + (delay || 0);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
          }
          const vol = Math.max(0.001, this.getGain() * volMult);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        },
        sfxJump() {
          this.playTone(240, "triangle", 0.13, 0.22, 640);
          this.playTone(120, "sine", 0.08, 0.10, 60, 0.02);
        },
        sfxFastFall() {
          this.playTone(460, "sine", 0.11, 0.20, 140);
        },
        sfxCoin() {
          this.playTone(880, "sine", 0.10, 0.20, 1320);
          this.playTone(1760, "sine", 0.14, 0.14, 1760, 0.06);
        },
        sfxRecord() {
          this.playTone(523, "triangle", 0.12, 0.22, 523);
          this.playTone(784, "triangle", 0.12, 0.22, 784, 0.10);
          this.playTone(1046, "triangle", 0.22, 0.24, 1046, 0.20);
        },
        sfxHit() {
          this.playTone(170, "sawtooth", 0.24, 0.30, 52);
        },
        sfxLose() {
          this.playTone(220, "sawtooth", 0.45, 0.28, 48);
        },
        playMusicNote(freq, type, duration, volMult) {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type; osc.frequency.setValueAtTime(freq, now);
          const vol = Math.max(0.001, this.getGain() * volMult);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
          osc.connect(gain); gain.connect(this.musicBus || this.ctx.destination);
          osc.start(now); osc.stop(now + duration);
        },
        startMusic() {
          if (!appData.settings.music || this.isPlaying) return;
          this.init(); if (!this.ctx) return;
          this.isPlaying = true; this.step = 0;
          const track = getActiveMusic();
          const stepMs = Math.max(110, Math.round(60000 / track.bpm / 2));
          this.stepTimer = setInterval(() => {
            if (!appData.settings.music || !this.isPlaying || document.hidden) return;
            if (uiState.screen === "game" && uiState.paused) return;
            this.ensureMusicBus();
            if (this.musicFilter) this.musicFilter.frequency.setTargetAtTime(getActiveMusic().filter || 2200, this.ctx.currentTime, 0.1);
            const t = getActiveMusic(); const i = this.step % 16; const bar = Math.floor(this.step / 16); this.step++;
            const bassIdx = t.bass[i]; if (bassIdx >= 0) this.playMusicNote(MUSIC_SCALE[bassIdx], t.wave, 0.19, 0.065);
            if (t.kick && i % 4 === 0) this.playMusicNote(58, "sine", 0.12, 0.14);
            if (i % 8 === 0 && t.pad) t.pad.forEach((pi) => this.playMusicNote(MUSIC_SCALE[pi] * 2, "sine", 0.55, 0.018));
            const leadIdx = t.lead[i];
            if (leadIdx >= 0) {
              const oct = (bar % 2 === 1) ? 2 : 1;
              this.playMusicNote(MUSIC_SCALE[leadIdx] * oct, t.wave === "square" ? "triangle" : "sine", 0.16, t.leadVol);
            }
            if (t.hat && i % 2 === 1) this.playMusicNote(5200, "sine", 0.03, 0.010);
          }, stepMs);
        },
        restartMusic() { this.stopMusic(); if (appData.settings.music) this.startMusic(); },

      function hexToRgb(hex) {
        if (!hex || typeof hex !== "string" || !hex.startsWith("#")) return null;
        const clean = hex.slice(1);
        const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
        if (full.length !== 6) return null;
        const n = parseInt(full, 16);
        if (Number.isNaN(n)) return null;
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function lerpHex(hexA, hexB, t) {
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        if (!a || !b) return hexB || hexA || "#070812";
        const k = Math.max(0, Math.min(1, t));
        const r = Math.round(a.r + (b.r - a.r) * k);
        const g = Math.round(a.g + (b.g - a.g) * k);
        const bl = Math.round(a.b + (b.b - a.b) * k);
        return `rgb(${r},${g},${bl})`;
      }

      function getBiomeColors(meters, baseTheme) {
        let cur = BIOME_STAGES[0];
        let nxt = null;
        let blend = 0;

        for (let i = 0; i < BIOME_STAGES.length; i++) {
          if (meters >= BIOME_STAGES[i].minMeters) {
            cur = BIOME_STAGES[i];
            nxt = BIOME_STAGES[i + 1] || null;
          }
        }

        if (nxt) {
          const transitionZone = 90;
          const startAt = nxt.minMeters - transitionZone;
          if (meters >= startAt) {
            blend = Math.min(1, (meters - startAt) / transitionZone);
          }
        }

        const baseTop = cur.skyTopShift || baseTheme.skyTop;
        const targetTop = (nxt && nxt.skyTopShift) ? nxt.skyTopShift : baseTop;
        const skyTop = blend > 0 ? lerpHex(baseTop, targetTop, blend) : baseTop;

        const baseGrid = cur.gridAccent || baseTheme.gridV;
        const targetGrid = (nxt && nxt.gridAccent) ? nxt.gridAccent : baseGrid;
        const gridV = blend > 0 ? lerpHex(baseGrid, targetGrid, blend) : baseGrid;

        return { skyTop, gridV };
      }

      function startLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        lastFrameTime = performance.now();
        fpsFrames = 0;
        fpsAccum = 0;

        function tick(now) {
          if (uiState.screen !== "game" || !game) return;
          rafId = requestAnimationFrame(tick);

          const rawDt = Math.max(0, (now - lastFrameTime) / 1000);
          lastFrameTime = now;
          const dt = Math.min(0.05, rawDt);

          if (rawDt > 0) {
            fpsFrames++;
            fpsAccum += rawDt;
            if (fpsAccum >= 0.35) {
              currentFps = Math.max(1, Math.min(240, Math.round(fpsFrames / fpsAccum)));
              fpsFrames = 0;
              fpsAccum = 0;
            }
          }

          const stepScale = dt * 60;
          const theme = getActiveTheme();
          const skin = getActiveSkin();

          if (!uiState.paused && !uiState.gameOver && !document.hidden && uiState.resumeCountdown === 0) {
            if (game.hitstopTimer > 0) {
              game.hitstopTimer = Math.max(0, game.hitstopTimer - dt);
              if (game.shake > 0) game.shake = Math.max(0, game.shake - stepScale);
            } else {
              game.frame++;
              game.elapsed += dt;

              const diffProgress = Math.min(1, game.elapsed / 150);
              game.speedMult = 1 + diffProgress * 0.85;
              game.speed = game.baseSpeed * game.speedMult;

              const dx = game.speed * dt;
              game.rawDist += dx * 0.105; // PRO: metros suben ~25% más lento, velocidad de juego intacta
              game.meters = Math.floor(game.rawDist);

              // PRO: sin hitos flotantes. El progreso solo se ve en la barra inferior y en el recuadro de metros.
              if (game.meters >= game.nextMilestone) { game.nextMilestone = getNextMilestone(game.nextMilestone); }

              if (game.prevBestAtStart > 0 && !game.liveRecordBeat && game.meters > game.prevBestAtStart) {
                game.liveRecordBeat = true;
                game.recordMarkerPassed = true;
              }

              if (game.jumpBuffer > 0) game.jumpBuffer = Math.max(0, game.jumpBuffer - dt);

              const gravity = game.fastFalling ? 5850 : 3168;
              game.vy += gravity * dt;
              game.y += game.vy * dt;
              if (game.y >= SHIP_REST_Y) {
                game.y = SHIP_REST_Y;
                game.vy = 0;
                game.grounded = true;
                game.fastFalling = false;
                if (game.jumpBuffer > 0) executeJump();
              }

              game.trail.unshift({ y: game.y + 17 });
              const maxTrail = game.streak >= 20 ? 11 : (game.streak >= 10 ? 8 : 6);
              if (game.trail.length > maxTrail) game.trail.length = maxTrail;
              for (let i = 0; i < game.trail.length; i++) {
                game.trail[i].x = 75 - (i + 1) * 7.2;
              }

              if (game.invuln > 0) game.invuln = Math.max(0, game.invuln - stepScale);
              if (game.hitFlash > 0) game.hitFlash = Math.max(0, game.hitFlash - stepScale);

              for (let i = game.shockwaves.length - 1; i >= 0; i--) {
                const sw = game.shockwaves[i];
                sw.r += 180 * dt;
                sw.life -= dt;
                if (sw.life <= 0) game.shockwaves.splice(i, 1);
              }

              // Generación de obstáculos
              game.nextObs -= dx;
              if (game.nextObs <= 0) {
                const coinConflict = game.coins.some((c) => !c.taken && c.x > 250 && c.x < 540);
                if (coinConflict) {
                  game.nextObs = Math.max(45, (game.speed / 60) * 9);
                } else {
                  const pal1 = OBS_PALETTES[Math.floor(Math.random() * OBS_PALETTES.length)];
                  const pal2 = OBS_PALETTES[Math.floor(Math.random() * OBS_PALETTES.length)];
                  const roll = Math.random();
                  const canOscillate = game.meters >= 400 && Math.random() < 0.35;

                  if (diffProgress < 0.15 || roll < 0.55) {
                    const isSpike = Math.random() > 0.45;
                    const w = isSpike ? (26 + Math.random() * 14) : (24 + Math.random() * 18);
                    const baseH = 38 + Math.random() * 32;
                    game.obstacles.push({
                      x: 380,
                      w,
                      baseH,
                      h: baseH,
                      spike: isSpike,
                      pal: pal1,
                      passed: false,
                      oscillate: canOscillate,
                      oscPhase: Math.random() * Math.PI * 2
                    });
                  } else if (roll < 0.82) {
                    const h1 = 34 + Math.random() * 18;
                    const h2 = 42 + Math.random() * 24;
                    const gap = 28 + Math.random() * 18;
                    game.obstacles.push(
                      { x: 380, w: 24, baseH: h1, h: h1, spike: Math.random() > 0.5, pal: pal1, passed: false, oscillate: false, oscPhase: 0 },
                      { x: 380 + gap, w: 26, baseH: h2, h: h2, spike: Math.random() > 0.4, pal: pal2, passed: false, oscillate: canOscillate, oscPhase: 1.2 }
                    );
                  } else {
                    const baseH = 42 + Math.random() * 20;
                    game.obstacles.push({
                      x: 380,
                      w: 30,
                      baseH,
                      h: baseH,
                      spike: true,
                      pal: pal1,
                      passed: false,
                      oscillate: false,
                      oscPhase: 0
                    });
                    const variant = COIN_VARIANTS[Math.floor(Math.random() * COIN_VARIANTS.length)];
                    for (let j = 0; j < 3; j++) {
                      const arcY = 315 - Math.sin((j / 2) * Math.PI) * 26;
                      game.coins.push({
                        x: 365 + j * 30,
                        y: arcY,
                        taken: false,
                        variant,
                        spin: j * 0.4
                      });
                    }
                  }

                  const minGap = Math.max(195, 290 - diffProgress * 85);
                  game.nextObs = minGap + Math.random() * 95;
                }
              }

              // Generación de monedas
              game.nextCoin -= dx;
              if (game.nextCoin <= 0) {
                const blocked = game.obstacles.some((o) => o.x + o.w > 240 && o.x < 560);
                if (!blocked) {
                  const patternType = Math.floor(Math.random() * 4);
                  const variant = COIN_VARIANTS[Math.floor(Math.random() * COIN_VARIANTS.length)];
                  if (patternType === 0) {
                    for (let j = 0; j < 5; j++) {
                      const arc = Math.sin((j / 4) * Math.PI) * -42;
                      game.coins.push({ x: 380 + j * 30, y: 306 + arc, taken: false, variant, spin: j * 0.3 });
                    }
                  } else if (patternType === 1) {
                    for (let j = 0; j < 4; j++) {
                      game.coins.push({ x: 380 + j * 32, y: 262, taken: false, variant, spin: j * 0.3 });
                    }
                  } else if (patternType === 2) {
                    for (let j = 0; j < 4; j++) {
                      game.coins.push({ x: 380 + j * 32, y: 318, taken: false, variant, spin: j * 0.3 });
                    }
                  } else {
                    for (let j = 0; j < 5; j++) {
                      const vMix = COIN_VARIANTS[j % COIN_VARIANTS.length];
                      game.coins.push({
                        x: 380 + j * 30,
                        y: j % 2 === 0 ? 316 : 278,
                        taken: false,
                        variant: vMix,
                        spin: j * 0.5
                      });
                    }
                  }
                }
                game.nextCoin = 280 + Math.random() * 250;
              }

              // Obstáculos y racha
              for (let i = game.obstacles.length - 1; i >= 0; i--) {
                const o = game.obstacles[i];
                o.x -= dx;
                if (o.oscillate) {
                  o.oscPhase += 3.4 * dt;
                  o.h = Math.max(26, o.baseH + Math.sin(o.oscPhase) * 14);
                }
                if (!o.passed && o.x + o.w < 58) {
                  o.passed = true;
                  game.streak++;
                }
                if (o.x <= -60) game.obstacles.splice(i, 1);
              }

              // Monedas y magnetismo a racha 15+
              const magnetOn = game.streak >= 15;
              const shipX = 75;
              const shipY = game.y + 17;

              for (let i = game.coins.length - 1; i >= 0; i--) {
                const c = game.coins[i];
                if (magnetOn && !c.taken) {
                  const dxC = shipX - c.x;
                  const dyC = shipY - c.y;
                  const distSq = dxC * dxC + dyC * dyC;
                  if (distSq < 19600 && distSq > 1) {
                    const dist = Math.sqrt(distSq);
                    const pull = 290 * dt;
                    c.x += (dxC / dist) * pull;
                    c.y += (dyC / dist) * pull;
                  } else {
                    c.x -= dx;
                  }
                } else {
                  c.x -= dx;
                }
                c.spin += 4.8 * dt;

                if (!c.taken && c.x + 12 > 58 && c.x - 12 < 92 && c.y + 12 > game.y && c.y - 12 < game.y + 34) {
                  c.taken = true;
                  game.coinCount++;
                  soundEngine.sfxCoin();
                  triggerVibrate(16);
                  if (game.parts.length < 48) {
                    for (let j = 0; j < 8; j++) {
                      game.parts.push({
                        x: c.x,
                        y: c.y,
                        vx: (Math.random() - 0.5) * 310,
                        vy: (Math.random() - 0.5) * 310,
                        life: 0.34,
                        maxLife: 0.34,
                        c: c.variant.fill
                      });
                    }
                  }
                }

                if (c.x <= -60 || c.taken) {
                  game.coins.splice(i, 1);
                }
              }

              // Colisiones con obstáculos
              if (game.invuln === 0) {
                for (let i = 0; i < game.obstacles.length; i++) {
                  const o = game.obstacles[i];
                  if (game.invuln === 0 && 89 > o.x + 4 && 59 < o.x + o.w - 4 && game.y + 32 > GROUND_Y - o.h) {
                    game.hearts--;
                    game.streak = 0;
                    game.invuln = 90;
                    game.shake = 12;
                    game.hitFlash = 10;
                    game.hitstopTimer = 0.045;
                    game.shockwaves.push({
                      x: 75,
                      y: game.y + 17,
                      r: 10,
                      life: 0.36,
                      maxLife: 0.36,
                      c: o.pal.main
                    });
                    soundEngine.sfxHit();
                    triggerVibrate(105);
                    for (let j = 0; j < 12; j++) {
                      game.parts.push({
                        x: 75,
                        y: game.y + 16,
                        vx: (Math.random() - 0.5) * 360,
                        vy: (Math.random() - 0.5) * 360,
                        life: 0.38,
                        maxLife: 0.38,
                        c: o.pal.main
                      });
                    }
                    if (game.hearts <= 0) {
                      finalizeGameOver();
                    }
                    break;
                  }
                }
              }

              for (let i = game.parts.length - 1; i >= 0; i--) {
                const pt = game.parts[i];
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.life -= dt;
                if (pt.life <= 0) game.parts.splice(i, 1);
              }
              if (game.shake > 0) game.shake = Math.max(0, game.shake - stepScale);

              updateSessionMissions();
            }

            if (game.frame % 4 === 0) {
              updateGameHudDOM();
            }
          }

          renderGameCanvas(theme, skin);
        }

        rafId = requestAnimationFrame(tick);
      }

      // =========================================================================
      // 9. RENDERIZADO CANVAS 2D OPTIMIZADO PARA ALTOS FPS EN MÓVIL
      // =========================================================================
      function renderGameCanvas(theme, skin) {
        const canvas = document.getElementById("gameCanvas");
        if (!canvas || !game) return;
        const ctx = canvas.getContext("2d", { alpha: false });
        const W = 360;
        const H = 480;
        const biome = getBiomeColors(game.meters, theme);

        // Actualizar cache de gradientes solo cuando cambian colores
        const cacheKey = `${theme.id}|${biome.skyTop}`;
        if (canvasCache.key !== cacheKey) {
          canvasCache.key = cacheKey;
          const sg = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
          sg.addColorStop(0, biome.skyTop);
          sg.addColorStop(0.5, theme.skyMid);
          sg.addColorStop(0.85, theme.skyLow);
          sg.addColorStop(1, theme.skyHorizon);
          canvasCache.skyGrad = sg;

          const mg = ctx.createLinearGradient(272, 60, 272, 136);
          mg.addColorStop(0, theme.moonTop);
          mg.addColorStop(0.55, theme.moonMid);
          mg.addColorStop(1, theme.moonBot);
          canvasCache.moonGrad = mg;
        }

        ctx.save();
        if (game.shake > 0) {
          ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
        }

        // 1. Cielo degradado cacheado
        ctx.fillStyle = canvasCache.skyGrad;
        ctx.fillRect(0, 0, W, H);

        // 1.5 Atmósfera especial del tema (Aurora boreal / Rayos solares / Nebulosa)
        if (theme.atmosphere === "aurora") {
          ctx.save();
          const waveY = 58 + Math.sin(game.elapsed * 1.1) * 8;
          ctx.fillStyle = "rgba(52, 211, 153, 0.11)";
          ctx.beginPath();
          ctx.moveTo(0, waveY);
          ctx.quadraticCurveTo(110, waveY - 24, 220, waveY + 10);
          ctx.quadraticCurveTo(300, waveY + 26, W, waveY - 8);
          ctx.lineTo(W, waveY + 42);
          ctx.quadraticCurveTo(240, waveY + 58, 120, waveY + 24);
          ctx.quadraticCurveTo(45, waveY + 12, 0, waveY + 34);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        } else if (theme.atmosphere === "solar") {
          ctx.save();
          ctx.fillStyle = "rgba(255, 183, 3, 0.08)";
          ctx.beginPath();
          ctx.arc(272, 98, 86, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 2. Luna Outrun con halo eficiente (sin shadowBlur costoso en móvil) y cortes horizontales
        const moonX = 272;
        const moonY = 98;
        const moonR = 38;
        ctx.fillStyle = theme.moonRing;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR + 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = canvasCache.moonGrad;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = theme.moonCut;
        for (let sy = moonY + 4; sy < moonY + moonR; sy += 7) {
          ctx.fillRect(moonX - moonR, sy, moonR * 2, 2.2);
        }

        // 3. Estrellas parpadeantes
        for (let i = 0; i < game.stars.length; i++) {
          const st = game.stars[i];
          const alpha = 0.35 + 0.65 * Math.abs(Math.sin(game.elapsed * 2.2 + st.phase));
          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
          ctx.fillRect(st.x - st.r, st.y - st.r, st.r * 2, st.r * 2);
        }

        // 4. Edificios lejanos en parallax
        const farScroll = (game.rawDist * 11) % 544;
        for (let i = 0; i < game.farBuildings.length; i++) {
          const b = game.farBuildings[i];
          let bx = b.x - farScroll;
          if (bx + b.w < 0) bx += 544;
          const by = GROUND_Y - b.h;
          ctx.fillStyle = "rgba(10, 12, 30, 0.78)";
          ctx.fillRect(bx, by, b.w, b.h);
          ctx.strokeStyle = b.hue === CYAN ? "rgba(0, 240, 255, 0.25)" : "rgba(255, 46, 166, 0.25)";
          ctx.lineWidth = 1;
          ctx.strokeRect(bx + 0.5, by + 0.5, b.w - 1, b.h);
        }

        // 5. Edificios cercanos con ventanas encendidas
        const nearScroll = (game.rawDist * 22) % 546;
        for (let i = 0; i < game.nearBuildings.length; i++) {
          const b = game.nearBuildings[i];
          let bx = b.x - nearScroll;
          if (bx + b.w < 0) bx += 546;
          const by = GROUND_Y - b.h;
          ctx.fillStyle = "#080a1c";
          ctx.fillRect(bx, by, b.w, b.h);
          ctx.strokeStyle = b.accent;
          ctx.globalAlpha = 0.42;
          ctx.strokeRect(bx + 0.5, by + 0.5, b.w - 1, b.h);

          ctx.fillStyle = b.accent;
          ctx.globalAlpha = 0.34;
          const padX = 7;
          const padY = 9;
          const cellW = (b.w - padX * 2) / b.cols;
          const winW = Math.max(3, cellW - 5);
          for (let r = 0; r < b.rows; r++) {
            for (let c = 0; c < b.cols; c++) {
              if ((r + c) % 2 === 0) {
                ctx.fillRect(bx + padX + c * cellW + 2, by + padY + r * 12, winW, 5);
              }
            }
          }
          ctx.globalAlpha = 1;
        }

        // 6. Suelo con rejilla synthwave en perspectiva
        ctx.fillStyle = theme.groundBg;
        ctx.fillRect(0, GROUND_Y, W, 120);

        // Baliza fantasma de récord personal
        if (game.prevBestAtStart > 0 && !game.recordMarkerPassed) {
          const deltaMeters = game.prevBestAtStart - game.meters;
          const markerX = 75 + (deltaMeters / 0.105);
          if (markerX >= -20 && markerX <= W + 24) {
            ctx.save();
            ctx.strokeStyle = GOLD;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(markerX, GROUND_Y - 72);
            ctx.lineTo(markerX, GROUND_Y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = GOLD;
            ctx.beginPath();
            ctx.moveTo(markerX, 344);
            ctx.lineTo(markerX + 18, GROUND_Y - 65);
            ctx.lineTo(markerX, GROUND_Y - 58);
            ctx.closePath();
            ctx.fill();

            ctx.font = "bold 9px 'Orbitron', system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`RÉCORD ${game.prevBestAtStart}m`, markerX, 336);
            ctx.restore();
          }
        }

        // Línea de horizonte con doble halo rápido (cero shadowBlur lag)
        ctx.fillStyle = theme.horizonLine;
        ctx.globalAlpha = 0.10;
        ctx.fillRect(0, GROUND_Y - 26, W, 26);
        ctx.fillStyle = theme.horizonLine;
        ctx.globalAlpha = 0.28;
        ctx.fillRect(0, GROUND_Y - 3, W, 9);
        ctx.globalAlpha = 1;
        ctx.fillRect(0, GROUND_Y, W, 3);

        // Líneas horizontales de la rejilla
        ctx.strokeStyle = theme.gridH;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 12); ctx.lineTo(W, GROUND_Y + 12);
        ctx.moveTo(0, GROUND_Y + 28); ctx.lineTo(W, GROUND_Y + 28);
        ctx.moveTo(0, GROUND_Y + 48); ctx.lineTo(W, GROUND_Y + 48);
        ctx.stroke();

        // Líneas diagonales en movimiento de la rejilla
        const gridOffset = (game.rawDist * 36) % 40;
        ctx.strokeStyle = biome.gridV;
        ctx.beginPath();
        for (let gx = -40; gx <= W + 40; gx += 40) {
          const topX = gx - gridOffset;
          const botX = 180 + (topX - 180) * 1.45;
          ctx.moveTo(topX, 418);
          ctx.lineTo(botX, H);
        }
        ctx.stroke();

        // 7. Monedas de 5 formas con halo rápido y reflejo interior
        for (let i = 0; i < game.coins.length; i++) {
          const c = game.coins[i];
          if (c.taken) continue;
          const v = c.variant;
          const scaleX = 0.72 + 0.28 * Math.abs(Math.cos(c.spin));
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.scale(scaleX, 1);

          // Halo ligero sin shadowBlur
          ctx.fillStyle = v.glow;
          ctx.globalAlpha = 0.22;
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;

          ctx.fillStyle = v.fill;
          ctx.strokeStyle = v.stroke;
          ctx.lineWidth = 1.8;

          if (v.shape === "circle") {
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(-2.5, -2.5, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,.85)";
            ctx.beginPath(); ctx.ellipse(-3.5, -4.5, 3.4, 1.7, -0.6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = v.stroke;
            ctx.font = "900 11px 'Orbitron',sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1; ctx.strokeText("★", 0, 0.5);
            ctx.fillText("★", 0, 0.5);
          } else if (v.shape === "hex") {
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
              const ang = (k * Math.PI) / 3;
              const px = Math.cos(ang) * 10.5;
              const py = Math.sin(ang) * 10.5;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (v.shape === "diamond") {
            ctx.beginPath();
            ctx.moveTo(0, -11.5);
            ctx.lineTo(9.5, 0);
            ctx.lineTo(0, 11.5);
            ctx.lineTo(-9.5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(4, 0);
            ctx.lineTo(0, 5);
            ctx.lineTo(-4, 0);
            ctx.closePath();
            ctx.fill();
          } else if (v.shape === "star") {
            ctx.beginPath();
            for (let k = 0; k < 10; k++) {
              const r = k % 2 === 0 ? 11.5 : 5.2;
              const ang = (k * Math.PI) / 5 - Math.PI / 2;
              const px = Math.cos(ang) * r;
              const py = Math.sin(ang) * r;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = theme.skyLow;
            ctx.beginPath();
            ctx.arc(0, 0, 4.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 8. Obstáculos de colores neón con borde superior brillante
        for (let i = 0; i < game.obstacles.length; i++) {
          const o = game.obstacles[i];
          const topY = GROUND_Y - o.h;

          if (o.spike) {
            ctx.fillStyle = o.pal.main;
            ctx.beginPath();
            ctx.moveTo(o.x, GROUND_Y);
            ctx.lineTo(o.x + o.w / 2, topY);
            ctx.lineTo(o.x + o.w, GROUND_Y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = o.pal.top;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = o.pal.stripe;
            ctx.beginPath();
            ctx.moveTo(o.x + o.w * 0.34, GROUND_Y);
            ctx.lineTo(o.x + o.w / 2, topY + 10);
            ctx.lineTo(o.x + o.w * 0.66, GROUND_Y);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillStyle = o.pal.main;
            ctx.fillRect(o.x, topY, o.w, o.h);
            ctx.fillStyle = o.pal.top;
            ctx.fillRect(o.x, topY, o.w, 4);
            ctx.fillStyle = o.pal.stripe;
            ctx.globalAlpha = 0.45;
            ctx.fillRect(o.x + 4, topY + 10, o.w - 8, 4);
            ctx.globalAlpha = 1;
          }
        }

        // 9. Estela dinámica vinculada a la racha de esquivas
        const isBlinkHidden = game.invuln > 0 && Math.floor(game.frame / 5) % 2 === 0;
        if (game.trail.length > 0 && !isBlinkHidden && getActiveTrail().shape !== "none") {
          const _tr = getActiveTrail();
          const trailColor = _tr.color ? (_tr.shape === "rainbow" ? `hsl(${(game.frame * 4) % 360}, 100%, 60%)` : _tr.color) : (game.streak >= 10 ? skin.thruster : skin.body);
          ctx.fillStyle = trailColor;
          for (let i = game.trail.length - 1; i >= 0; i--) {
            const tr = game.trail[i];
            const ratio = 1 - i / (game.trail.length + 1);
            const radius = (game.streak >= 15 ? 10.5 : 7.5) * ratio;
            ctx.globalAlpha = ratio * (game.streak >= 10 ? 0.38 : 0.22);
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, Math.max(2, radius), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // 10. Nave del jugador con su geometría distintiva
        if (!isBlinkHidden) {
          const px = 75;
          const py = game.y + 17;
          ctx.save();
          ctx.translate(px, py);

          // Aura neón ligera alrededor de la nave
          ctx.fillStyle = skin.body;
          ctx.globalAlpha = 0.16;
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;

          const flameLen = 10 + Math.sin(game.frame * 0.7) * 4;
          drawShipShape(ctx, skin, flameLen);
          ctx.restore();
        }

        // 11. Ondas expansivas al recibir daño
        for (let i = 0; i < game.shockwaves.length; i++) {
          const sw = game.shockwaves[i];
          ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.85;
          ctx.strokeStyle = sw.c || PINK;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // 12. Partículas
        for (let i = 0; i < game.parts.length; i++) {
          const pt = game.parts[i];
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.fillStyle = pt.c;
          ctx.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
        }
        ctx.globalAlpha = 1;

        // 13. PRO: sin banners flotantes (hitos / misiones / récord). El récord vivo solo se marca en el HUD.
        // Flash rojo suave al recibir impacto
        if (game.hitFlash > 0) {
          ctx.fillStyle = `rgba(255,30,86,${(game.hitFlash / 32).toFixed(2)})`;
          ctx.fillRect(0, 0, W, H);
        }

        ctx.restore();
      }

      function updateGameHudDOM() {
        if (!game) return;
        const theme = getActiveTheme();
        const labelEl = document.getElementById("hud-dist-label");
        const scoreEl = document.getElementById("hud-score-val");
        const statsEl = document.getElementById("hud-streak-line");
        const heartsEl = document.getElementById("hud-hearts-row");
        const coinsEl = document.getElementById("hud-coins-val");
        const fpsEl = document.getElementById("hud-fps-val");
        const bottomFill = document.getElementById("hud-bottom-fill");
        const bottomVal = document.getElementById("hud-bottom-val");

        if (labelEl) {
          labelEl.textContent = game.liveRecordBeat ? "★ RÉCORD EN VIVO · 1m = 1pt" : "DISTANCIA / SCORE (1m = 1pt)";
          labelEl.style.color = game.liveRecordBeat ? GOLD : "rgba(255,255,255,0.6)";
        }
        if (scoreEl) {
          scoreEl.innerHTML = `${game.meters.toLocaleString()} <span style="font-size:12px;color:#fff;">pts</span>`;
          scoreEl.style.color = game.liveRecordBeat ? GOLD : theme.accent;
        }
        if (statsEl) {
          const mult = computeVisualMultiplier(game.streak).toFixed(2);
          const kmh = Math.round(36 * game.speedMult);
          const magnetTxt = game.streak >= 15 ? " · 🧲" : "";
          statsEl.textContent = `🔥 ${game.streak} · x${mult} · ${kmh} km/h${magnetTxt}`;
        }
        if (heartsEl) {
          heartsEl.innerHTML = [1, 2, 3].map((idx) =>
            `<span style="color:${idx <= game.hearts ? "#f87171" : "rgba(255,255,255,0.18)"};display:inline-flex;">${idx <= game.hearts ? ICONS.heartFull : ICONS.heartEmpty}</span>`
          ).join("");
        }
        if (coinsEl) { const sp = coinsEl.querySelector("span"); if (sp) sp.textContent = "+" + game.coinCount; else coinsEl.textContent = "+" + game.coinCount; }
        if (fpsEl) {
          fpsEl.textContent = `${currentFps} FPS`;
        }
        if (bottomFill) bottomFill.style.width = Math.min(100, appData.stats.bestRunDistance > 0 ? Math.round((game.meters / appData.stats.bestRunDistance) * 100) : 0) + "%";
        if (bottomVal) bottomVal.textContent = game.meters.toLocaleString() + "m";
      }

      function renderMissionsHtml() {
        return appData.missions.map((m) => {
          const cur = Math.min(m.target, m.current);
          return `
            <div style="padding:5px 7px;border-radius:11px;background:${m.claimed ? "rgba(110,231,183,0.14)" : "rgba(255,255,255,0.06)"};border:1px solid ${m.claimed ? "rgba(110,231,183,0.45)" : "rgba(255,255,255,0.1)"};font-size:10px;line-height:1.25;">
              <div style="font-weight:700;color:${m.claimed ? "#6ee7b7" : "#fff"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.title}</div>
              <div style="margin-top:2px;font-weight:700;color:${m.claimed ? "#6ee7b7" : GOLD};">${m.claimed ? `✓ +${m.reward} 🪙` : `${cur}/${m.target} · +${m.reward}🪙`}</div>
            </div>
          `;
        }).join("");
      }

      // =========================================================================
      // 10. RENDERIZADO DE PANTALLAS Y MODALES
      // =========================================================================
      function renderApp() {
        const root = document.getElementById("app");
        if (!root) return;

        const theme = getActiveTheme();
        const skin = getActiveSkin();

        root.style.setProperty("--bg", theme.appBg);
        root.style.setProperty("--surface", theme.surface);
        root.style.setProperty("--surface-2", theme.surface2);
        root.style.setProperty("--line", theme.line);
        root.style.setProperty("--accent", theme.accent);
        root.style.setProperty("--secondary", theme.secondary);

        let mainHtml = "";

        // -----------------------------------------------------------------------
        // PANTALLA 1: MENÚ PRINCIPAL
        // -----------------------------------------------------------------------
        if (uiState.screen === "menu") {
          mainHtml = `
            <div style="display:flex;flex-direction:column;gap:11px;">
              <div style="border-radius:24px;padding:16px;text-align:center;background:${theme.heroGrad};border:1px solid ${theme.accent}55;">
                <div class="anim-floaty" style="width:68px;height:68px;margin:0 auto;border-radius:20px;background:rgba(0,0,0,0.45);border:1px solid ${skin.body}66;display:grid;place-items:center;box-shadow:0 12px 26px ${skin.glow};">
                  ${getSkinPreviewSvg(skin)}

                  <div>
                    <div style="font-size:13.5px;font-weight:700;">Contador FPS en Partida</div>
                    <div style="font-size:11px;color:var(--muted);">Muestra cuadros por segundo en el HUD</div>
                  </div>
                  <button id="toggle-fps" class="switch-btn ${appData.settings.showFps ? "on" : ""}" aria-label="FPS">
                    <span class="switch-knob"></span>
                  </button>
                </div>
              </div>

              <button id="btn-back-menu-bottom" class="btn-outline">
                ${ICONS.back}
                <span>REGRESAR AL MENÚ</span>
              </button>
            </div>
          `;
        }

        // -----------------------------------------------------------------------
        // PANTALLA 5: JUEGO ACTIVO (100% TOUCH EN CANVAS: TOCAR SALTA, DOBLE TOQUE BAJA)
        // -----------------------------------------------------------------------
        else if (uiState.screen === "game" && game) {
          const mult = computeVisualMultiplier(game.streak).toFixed(2);
          const kmh = Math.round(36 * game.speedMult);
          const heartsHtml = [1, 2, 3].map((idx) =>
            `<span style="color:${idx <= game.hearts ? "#f87171" : "rgba(255,255,255,0.18)"};display:inline-flex;">${idx <= game.hearts ? ICONS.heartFull : ICONS.heartEmpty}</span>`
          ).join("");

          let overlayHtml = "";
          if (uiState.resumeCountdown > 0 && !uiState.paused && !uiState.gameOver) {
            overlayHtml = `
              <div class="overlay-layer" style="background:rgba(5,6,18,0.55);align-items:center;pointer-events:none;">
                <div class="font-display" style="width:84px;height:84px;border-radius:50%;background:rgba(17,20,40,0.94);border:2px solid ${theme.accent};color:${GOLD};display:grid;place-items:center;font-size:42px;box-shadow:0 0 26px ${theme.accent}66;">
                  ${uiState.resumeCountdown}
                </div>
              </div>
            `;
          } else if (uiState.paused && !uiState.gameOver) {
            overlayHtml = `
              <div class="overlay-layer">
                <div class="card" style="padding:18px;text-align:center;">
                  <div class="font-display" style="font-size:23px;color:#fff;">PAUSA</div>
                  <p style="font-size:12.5px;color:var(--muted);margin:6px 0 16px;">Al continuar tendrás una cuenta regresiva 3-2-1.</p>
                  <div style="display:flex;flex-direction:column;gap:9px;">
                    <button id="btn-resume-game" class="btn-primary">
                      ${ICONS.play}
                      <span>CONTINUAR (3 - 2 - 1)</span>
                    </button>
                    <button id="btn-restart-pause" class="btn-outline" style="border-color:${theme.secondary}66;color:${theme.secondary};">
                      ${ICONS.restart}
                      <span>REINICIAR PARTIDA</span>
                    </button>
                    <button id="btn-quit-menu" class="btn-outline">
                      ${ICONS.back}
                      <span>SALIR AL MENÚ</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          } else if (uiState.gameOver && uiState.lastRunSummary) {
            const sum = uiState.lastRunSummary;
            overlayHtml = `
              <div class="overlay-layer">
                <div class="card" style="padding:16px;text-align:center;border-color:${uiState.isNewRecordRun ? GOLD : theme.accent};">
                  <div class="font-display" style="font-size:12px;color:${uiState.isNewRecordRun ? GOLD : theme.secondary};letter-spacing:0.12em;">
                    ${uiState.isNewRecordRun ? "★ NUEVO RÉCORD PERSONAL ★" : "FIN DE PARTIDA"}
                  </div>
                  <div class="font-display" style="font-size:32px;color:${theme.accent};margin:4px 0;">
                    ${sum.distance.toLocaleString()} <span style="font-size:14px;color:#fff;">pts</span>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px;text-align:center;">
                    <div style="padding:8px;border-radius:12px;background:rgba(0,0,0,0.38);">
                      <div style="font-size:10.5px;color:var(--muted);">Monedas Ganadas</div>
                      <div class="font-display" style="font-size:15px;color:${GOLD};margin-top:2px;display:flex;align-items:center;justify-content:center;gap:5px;">${ICONS.coin}<span>+${sum.coins}</span></div>
                    </div>
                    <div style="padding:8px;border-radius:12px;background:rgba(0,0,0,0.38);">
                      <div style="font-size:10.5px;color:var(--muted);">Score Acumulado</div>
                      <div class="font-display" style="font-size:15px;color:#fff;margin-top:2px;">${sum.totalAccumulated.toLocaleString()}</div>
                    </div>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    <button id="btn-play-again" class="btn-primary" style="background:linear-gradient(90deg, ${theme.accent}, ${theme.secondary});">
                      ${ICONS.restart}
                      <span>VOLVER A JUGAR</span>
                    </button>
                    <button id="btn-go-record-over" class="btn-outline" style="border-color:${GOLD}55;color:${GOLD};">${ICONS.trophy}<span>VER MI RÉCORD</span></button>
                    <button id="btn-go-shop-over" class="btn-outline" style="border-color:${GOLD}55;color:${GOLD};">
                      ${ICONS.shop}
                      <span>IR A TIENDA</span>
                    </button>
                    <button id="btn-quit-menu" class="btn-outline">
                      ${ICONS.back}
                      <span>MENÚ PRINCIPAL</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }

          mainHtml = `
            <div style="display:flex;flex-direction:column;height:100%;gap:7px;">
              <div class="canvas-wrap" style="border-color:${game.liveRecordBeat ? GOLD + "77" : "var(--line)"};">
                <canvas id="gameCanvas" width="360" height="480"></canvas>
                <button id="btn-pause-game" aria-label="Pausar" style="position:absolute;top:10px;right:10px;z-index:10;width:38px;height:38px;border-radius:50%;background:${theme.accent};color:#070c14;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.45);">${ICONS.pause}</button>
                <div style="position:absolute;bottom:8px;left:0;right:0;text-align:center;pointer-events:none;font-size:10px;font-weight:700;letter-spacing:0.06em;color:rgba(255,255,255,0.5);">
                  TOCA PANTALLA: SALTAR · DOBLE TOQUE: BAJAR
                </div>
                ${overlayHtml}
              </div>
              <div class="card" style="padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;margin-top:2px;">
                <div style="min-width:0;">
                  <div id="hud-dist-label" style="font-size:10px;font-weight:700;letter-spacing:0.06em;color:${game.liveRecordBeat ? GOLD : "rgba(255,255,255,0.6)"};">
                    ${game.liveRecordBeat ? "★ RÉCORD EN VIVO · 1m = 1pt" : "DISTANCIA / SCORE (1m = 1pt)"}
                  </div>
                  <div id="hud-score-val" class="font-display" style="font-size:22px;line-height:1.05;color:${game.liveRecordBeat ? GOLD : theme.accent};margin-top:1px;">
                    ${game.meters.toLocaleString()} <span style="font-size:12px;color:#fff;">pts</span>
                  </div>
                  <div id="hud-streak-line" style="font-size:11px;color:rgba(255,255,255,0.78);margin-top:2px;">
                    🔥 ${game.streak} · x${mult} · ${kmh} km/h${game.streak >= 15 ? " · 🧲" : ""}
                  </div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <div id="hud-hearts-row" style="display:flex;gap:2px;justify-content:flex-end;">${heartsHtml}</div>
                  <div id="hud-coins-val" style="font-size:11px;font-weight:800;color:${GOLD};margin-top:2px;display:inline-flex;align-items:center;gap:4px;">${ICONS.coin}<span>+${game.coinCount}</span></div>
                  ${appData.settings.showFps ? `<div id="hud-fps-val" style="font-size:10px;font-weight:700;color:${theme.accent};margin-top:1px;">${currentFps} FPS</div>` : ""}
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;padding:2px 2px 0;">
                <span id="hud-bottom-val" style="font-size:11px;font-weight:800;color:${theme.accent};white-space:nowrap;">${game.meters.toLocaleString()}m</span>
                <div style="flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden;"><div id="hud-bottom-fill" style="height:100%;width:${Math.min(100, appData.stats.bestRunDistance > 0 ? Math.round((game.meters / appData.stats.bestRunDistance) * 100) : 0)}%;background:linear-gradient(90deg, ${theme.accent}, ${GOLD});border-radius:99px;"></div></div>
                <span style="font-size:10px;color:var(--muted);white-space:nowrap;">RÉCORD ${appData.stats.bestRunDistance.toLocaleString()}m</span>
              </div>
            </div>
          `;
        }

        // -----------------------------------------------------------------------
        // MODALES GLOBALES (ALIAS DE JUGADOR Y SALIDA REAL ANDROID)
        // -----------------------------------------------------------------------
        let globalModalHtml = "";
        if (uiState.exitModalOpen) {
          globalModalHtml = `
            <div class="modal-global">
              <div class="card" style="width:100%;max-width:350px;padding:18px;text-align:center;">
                <div class="font-display" style="font-size:17px;color:#fca5a5;">¿SALIR DE NEON DASH PRO?</div>
                <p style="font-size:12.5px;color:var(--muted);margin:8px 0 16px;">Tu progreso, monedas y desbloqueos ya están guardados localmente.</p>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <button id="btn-cancel-exit" class="btn-outline">Cancelar</button>
                  <button id="btn-confirm-exit" class="btn-primary" style="background:#f87171;color:#070c14;">Salir</button>
                </div>
              </div>
            </div>
          `;
        }

        const toastHtml = uiState.toastMsg ? `<div class="toast-banner">${uiState.toastMsg}</div>` : "";

        root.innerHTML = `
          <header class="app-header">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              <div class="font-display" style="width:32px;height:32px;border-radius:10px;background:${skin.body};color:#070c14;display:grid;place-items:center;font-size:16px;font-weight:900;flex-shrink:0;">◆</div>
              <div style="min-width:0;">
                <div class="font-display" style="font-size:13.5px;line-height:1.1;color:#fff;">NEON DASH PRO <span style="font-size:9px;padding:2px 5px;border-radius:6px;background:#ffe14d;color:#070c14;vertical-align:middle;">PRO</span></div>
                <div style="font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${theme.name}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              <div style="display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:rgba(255,225,77,0.14);border:1px solid rgba(255,225,77,0.38);color:${GOLD};font-size:11.5px;font-weight:800;">${ICONS.coin}<span>${appData.coinsBalance.toLocaleString()}</span></div>
              <button id="btn-header-record" class="pill-btn" style="max-width:130px;border-color:${GOLD}55;color:${GOLD};"><span>🏆</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${appData.stats.bestRunDistance.toLocaleString()}m</span></button>
            </div>
          </header>

          <main class="app-main ${uiState.screen === "game" ? "game-mode" : ""}">
            ${mainHtml}
          </main>

          ${toastHtml}
          ${globalModalHtml}
        `;

        bindEvents();

        if (uiState.screen === "game" && game) {
          renderGameCanvas(theme, skin);
        }
      }

      // =========================================================================
      // 11. VINCULACIÓN SEGURA DE EVENTOS
      // =========================================================================
      function bindEvents() {
        const byId = (id) => document.getElementById(id);

        const btnHeaderRecord = byId("btn-header-record");
        if (btnHeaderRecord) btnHeaderRecord.onclick = () => { uiState.screen = "record"; renderApp(); };
        const btnPlay = byId("btn-play-main");
        if (btnPlay) { btnPlay.onclick = () => { initGameSession(); }; }
        const btnRecord = byId("btn-open-record");
        if (btnRecord) btnRecord.onclick = () => { uiState.screen = "record"; renderApp(); };        const btnShop = byId("btn-open-shop");
        if (btnShop) btnShop.onclick = () => { uiState.screen = "shop"; renderApp(); };

        const btnSettings = byId("btn-open-settings");
        if (btnSettings) btnSettings.onclick = () => { uiState.screen = "settings"; renderApp(); };

        const btnExit = byId("btn-open-exit");
        if (btnExit) btnExit.onclick = () => { uiState.exitModalOpen = true; renderApp(); };

        ["btn-back-menu", "btn-back-menu-bottom"].forEach((id) => {
          const el = byId(id);
          if (el) el.onclick = () => { uiState.screen = "menu"; renderApp(); };
        });

        const tabSkins = byId("tab-shop-skins");
        if (tabSkins) tabSkins.onclick = () => { uiState.shopTab = "skins"; renderApp(); };

        const tabMusic = byId("tab-shop-music");
        if (tabMusic) tabMusic.onclick = () => { uiState.shopTab = "music"; renderApp(); };
        const tabTrails = byId("tab-shop-trails");
        if (tabTrails) tabTrails.onclick = () => { uiState.shopTab = "trails"; renderApp(); };
        ["skins","themes","music","trails"].forEach((cat) => {
          const btnR = byId("btn-random-" + cat); if (btnR) btnR.onclick = () => applyRandomCategory(cat);
          const chk = byId("random-" + cat); if (chk) chk.onchange = () => { const k = {skins:"randomSkin",themes:"randomTheme",music:"randomMusic",trails:"randomTrail"}[cat]; appData.settings[k] = chk.checked; persistData(); showToast(chk.checked ? "Aleatorio en cada partida: ON" : "Aleatorio en cada partida: OFF"); };
        });
        const buyGeneric = (list, unlockedKey, equippedKey, id, name, onEquip) => {
          const item = list.find((x) => x.id === id); if (!item) return;
          const unlocked = appData.settings[unlockedKey].includes(id);
          if (appData.settings[equippedKey] === id) return;
          if (unlocked) { appData.settings[equippedKey] = id; persistData(); if (onEquip) onEquip(); showToast(`"${name}" aplicado.`); return; }
          if (appData.coinsBalance < item.price) { showToast(`Te faltan ${item.price - appData.coinsBalance} monedas.`); return; }
          appData.coinsBalance -= item.price; appData.settings[unlockedKey].push(id); appData.settings[equippedKey] = id; persistData(); if (onEquip) onEquip(); showToast(`¡Compraste y aplicaste "${name}"!`);
        };
        document.querySelectorAll("[data-music-id]").forEach((btn) => { btn.onclick = () => buyGeneric(MUSIC_TRACKS, "unlockedMusic", "equippedMusic", btn.getAttribute("data-music-id"), MUSIC_TRACKS.find((x) => x.id === btn.getAttribute("data-music-id")).name, () => soundEngine.restartMusic()); });
        document.querySelectorAll("[data-trail-id]").forEach((btn) => { btn.onclick = () => buyGeneric(SHIP_TRAILS, "unlockedTrails", "equippedTrail", btn.getAttribute("data-trail-id"), SHIP_TRAILS.find((x) => x.id === btn.getAttribute("data-trail-id")).name, null); });

        const tabThemes = byId("tab-shop-themes");
        if (tabThemes) tabThemes.onclick = () => { uiState.shopTab = "themes"; renderApp(); };

        document.querySelectorAll("[data-skin-id]").forEach((btn) => {
          btn.onclick = () => {
            const skinId = btn.getAttribute("data-skin-id");
            const sk = NEON_SKINS.find((s) => s.id === skinId);
            if (!sk) return;
            const unlocked = appData.settings.unlockedSkins.includes(sk.id);
            if (appData.settings.equippedSkin === sk.id) return;
            if (unlocked) {
              appData.settings.equippedSkin = sk.id;
              persistData();
              showToast(`Nave "${sk.name}" equipada.`);
              return;
            }
            if (appData.coinsBalance < sk.price) {
              showToast(`Te faltan ${sk.price - appData.coinsBalance} monedas.`);
              return;
            }
            appData.coinsBalance -= sk.price;
            appData.settings.unlockedSkins.push(sk.id);
            appData.settings.equippedSkin = sk.id;
            persistData();
            showToast(`¡Compraste y equipaste "${sk.name}"!`);
          };
        });

        document.querySelectorAll("[data-theme-id]").forEach((btn) => {
          btn.onclick = () => {
            const themeId = btn.getAttribute("data-theme-id");
            const th = INTERFACE_THEMES.find((t) => t.id === themeId);
            if (!th) return;
            const unlocked = appData.settings.unlockedThemes.includes(th.id);
            if (appData.settings.equippedTheme === th.id) return;
            if (unlocked) {
              appData.settings.equippedTheme = th.id;
              canvasCache.key = "";
              persistData();
              showToast(`Tema "${th.name}" aplicado.`);
              return;
            }
            if (appData.coinsBalance < th.price) {
              showToast(`Te faltan ${th.price - appData.coinsBalance} monedas.`);
              return;
            }
            appData.coinsBalance -= th.price;
            appData.settings.unlockedThemes.push(th.id);
            appData.settings.equippedTheme = th.id;
            canvasCache.key = "";
            persistData();
            showToast(`¡Compraste y aplicaste "${th.name}"!`);
          };
        });

        const tMusic = byId("toggle-music");
        if (tMusic) {
          tMusic.onclick = () => {
            appData.settings.music = !appData.settings.music;
            persistData();
            if (appData.settings.music) soundEngine.startMusic();
            else soundEngine.stopMusic();
            renderApp();
          };
        }

        const tSfx = byId("toggle-sfx");
        if (tSfx) {
          tSfx.onclick = () => {
            appData.settings.sfx = !appData.settings.sfx;
            persistData();
            if (appData.settings.sfx) soundEngine.sfxCoin();
            renderApp();
          };
        }

        const rVol = byId("range-volume");
        if (rVol) {
          rVol.oninput = (e) => {
            appData.settings.volume = Number(e.target.value);
            persistData();
            renderApp();
          };
        }

        const tVib = byId("toggle-vibrate");
        if (tVib) {
          tVib.onclick = () => {
            appData.settings.vibration = !appData.settings.vibration;
            persistData();
            if (appData.settings.vibration) triggerVibrate(25);
            renderApp();
          };
        }

        const tFps = byId("toggle-fps");
        if (tFps) {
          tFps.onclick = () => {
            appData.settings.showFps = !appData.settings.showFps;
            persistData();
            renderApp();
          };
        }

        // Control 100% táctil directo en el Canvas (1 toque salta, doble toque baja)
        const canvas = byId("gameCanvas");
        if (canvas) {
          canvas.onpointerdown = (ev) => {
            ev.preventDefault();
            handleCanvasTouchAction();
          };
        }

        const btnPause = byId("btn-pause-game");
        if (btnPause) {
          btnPause.onclick = () => {
            if (uiState.resumeCountdown > 0 || uiState.gameOver) return;
            uiState.paused = true;
            renderApp();
          };
        }

        const btnResume = byId("btn-resume-game");
        if (btnResume) btnResume.onclick = () => beginResumeCountdown();

        const btnRestartPause = byId("btn-restart-pause");
        if (btnRestartPause) btnRestartPause.onclick = () => initGameSession();

        const btnPlayAgain = byId("btn-play-again");
        if (btnPlayAgain) btnPlayAgain.onclick = () => initGameSession();

        const btnGoRecordOver = byId("btn-go-record-over");
          if (btnGoRecordOver) btnGoRecordOver.onclick = () => { if (rafId) cancelAnimationFrame(rafId); uiState.screen = "record"; renderApp(); };
          const btnGoShopOver = byId("btn-go-shop-over");
        if (btnGoShopOver) {
          btnGoShopOver.onclick = () => {
            if (rafId) cancelAnimationFrame(rafId);
            uiState.screen = "shop";
            renderApp();
          };
        }

        const btnQuitMenu = byId("btn-quit-menu");
        if (btnQuitMenu) {
          btnQuitMenu.onclick = () => {
            if (rafId) cancelAnimationFrame(rafId);
            uiState.paused = false;
            uiState.gameOver = false;
            uiState.screen = "menu";
            renderApp();
          };
        }

        const btnCancelExit = byId("btn-cancel-exit");
        if (btnCancelExit) {
          btnCancelExit.onclick = () => {
            uiState.exitModalOpen = false;
            renderApp();
          };
        }

        const btnConfirmExit = byId("btn-confirm-exit");
        if (btnConfirmExit) {
          btnConfirmExit.onclick = () => exitAndroidApplication();
        }
      }

      window.addEventListener("keydown", (ev) => {
        if (ev.repeat) return;
                if (uiState.screen === "game") {
          if (ev.code === "Space" || ev.code === "ArrowUp" || ev.code === "KeyW") {
            ev.preventDefault();
            requestJump();
          } else if (ev.code === "ArrowDown" || ev.code === "KeyS") {
            ev.preventDefault();
            requestFastFall();
          } else if (ev.code === "KeyP" || ev.code === "Escape") {
            if (!uiState.gameOver && uiState.resumeCountdown === 0) {
              if (uiState.paused) beginResumeCountdown();
              else { uiState.paused = true; renderApp(); }
            }
          }
        }
      });

      renderApp();
    })();
  </script>
</body>
</html>
