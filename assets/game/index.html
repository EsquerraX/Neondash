<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dash Neon Pro - Torneo Oficial</title>
  <style>
    :root {
      --bg: #070812;
      --surface: #111428;
      --surface-2: #191e3a;
      --line: rgba(255, 255, 255, 0.14);
      --accent: #00f0ff;
      --secondary: #ff2ea6;
      --gold: #ffe14d;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
      background: #03040a;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ocultar scrollbars en contenedores internos */
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden !important;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .font-display {
      font-family: 'Arial Black', 'Trebuchet MS', system-ui, sans-serif;
      letter-spacing: 0.04em;
    }

    /* Acabado PRO: contraste, microinteracciones y controles táctiles fiables. */
    button {
      min-height: 42px;
      transition: transform 120ms ease, filter 120ms ease, box-shadow 120ms ease;
    }
    button:active { transform: translateY(1px) scale(0.985); filter: brightness(1.12); }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .canvas-wrap {
      box-shadow: 0 0 0 1px rgba(0,240,255,0.08), 0 14px 38px rgba(0,0,0,0.34), 0 0 28px rgba(0,240,255,0.08);
    }
    @media (max-height: 700px) {
      .app-header { padding-top: 6px; padding-bottom: 6px; }
      .app-main { padding-top: 8px; padding-bottom: 8px; }
      .app-main.game-mode { padding-top: 5px; padding-bottom: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    .app-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .app-main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }

    .app-main.game-mode {
      overflow: hidden;
      padding: 8px 12px 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      cursor: pointer;
      border: none;
      outline: none;
      transition: transform 0.1s ease, opacity 0.15s ease, background 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #070c14;
      background: var(--accent);
      box-shadow: 0 8px 22px rgba(0, 240, 255, 0.22);
    }

    .btn-outline {
      width: 100%;
      padding: 13px 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--line);
    }

    .canvas-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #050614;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .overlay-layer {
      position: absolute;
      inset: 0;
      background: rgba(5, 6, 18, 0.84);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      z-index: 25;
      overflow-y: auto;
    }

    .modal-global {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 14, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .toast-banner {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 390px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(17, 20, 40, 0.96);
      border: 1px solid var(--accent);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 60;
      pointer-events: none;
      animation: fadeSlide 0.2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .anim-floaty {
      animation: floaty 2.8s ease-in-out infinite;
    }

    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid var(--line);
    }

    .tab-btn {
      padding: 9px 10px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--muted);
      background: transparent;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #070c14;
    }

    .switch-btn {
      width: 50px;
      height: 28px;
      border-radius: 999px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      transition: background 0.2s ease;
    }

    .switch-btn.on {
      background: var(--accent);
    }

    .switch-knob {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
    }

    .switch-btn.on .switch-knob {
      transform: translateX(22px);
      background: #070c14;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.42);
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }
  </style>
</head>

      // =========================================================================
      // 4. MOTOR DE AUDIO SYNTHWAVE PROCEDURAL (WEB AUDIO API) + HÁPTICA
      // =========================================================================
      const soundEngine = {
        ctx: null,
        isPlaying: false,
        stepTimer: null,
        step: 0,
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume().catch(() => {});
          }
        },
        getGain() {
          return Math.max(0, Math.min(1, (appData.settings.volume || 0) / 100));
        },
        playTone(freq, type, duration, volMult, slideFreq) {
          if (!appData.settings.sfx) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
          }
          const vol = Math.max(0.001, this.getGain() * volMult);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        },
        sfxJump() {
          this.playTone(260, "triangle", 0.14, 0.24, 620);
        },
        sfxCoin() {
          this.playTone(880, "sine", 0.11, 0.22, 1320);
        },
        sfxHit() {
          this.playTone(170, "sawtooth", 0.24, 0.30, 52);
        },
        sfxLose() {
          this.playTone(220, "sawtooth", 0.45, 0.28, 48);
        },
        startMusic() {
          if (!appData.settings.music || this.isPlaying) return;
          this.init();
          if (!this.ctx) return;
          this.isPlaying = true;
          const bassNotes = [110, 110, 130.81, 146.83, 110, 110, 164.81, 146.83];
          this.stepTimer = setInterval(() => {
            if (!appData.settings.music || !this.isPlaying || document.hidden) return;
            if (uiState.screen === "game" && uiState.paused) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const note = bassNotes[this.step % bassNotes.length];
            this.step++;
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(note, now);
            const vol = Math.max(0.001, this.getGain() * 0.065);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.19);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          }, 230);
        },
        stopMusic() {
          this.isPlaying = false;
          if (this.stepTimer) {
            clearInterval(this.stepTimer);
            this.stepTimer = null;
          }
        }
      };

      function hexToRgb(hex) {
        if (!hex || typeof hex !== "string" || !hex.startsWith("#")) return null;
        const clean = hex.slice(1);
        const full = clean.length === 3 ? clean.split("").map((c) => c + c).join("") : clean;
        if (full.length !== 6) return null;
        const n = parseInt(full, 16);
        if (Number.isNaN(n)) return null;
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function lerpHex(hexA, hexB, t) {
        const a = hexToRgb(hexA);
        const b = hexToRgb(hexB);
        if (!a || !b) return hexB || hexA || "#070812";
        const k = Math.max(0, Math.min(1, t));
        const r = Math.round(a.r + (b.r - a.r) * k);
        const g = Math.round(a.g + (b.g - a.g) * k);
        const bl = Math.round(a.b + (b.b - a.b) * k);
        return `rgb(${r}, ${g}, ${bl})`;
      }

      function getBiomeColors(meters, baseTheme) {
        let cur = BIOME_STAGES[0];
        let nxt = null;
        let blend = 0;

        for (let i = 0; i < BIOME_STAGES.length; i++) {
          if (meters >= BIOME_STAGES[i].minMeters) {
            cur = BIOME_STAGES[i];
            nxt = BIOME_STAGES[i + 1] || null;
          }
        }

        if (nxt) {
          const transitionZone = 90;
          const startAt = nxt.minMeters - transitionZone;
          if (meters >= startAt) {
            blend = Math.min(1, (meters - startAt) / transitionZone);
          }
        }

        const baseTop = cur.skyTopShift || baseTheme.skyTop;
        const targetTop = (nxt && nxt.skyTopShift) ? nxt.skyTopShift : baseTop;
        const skyTop = blend > 0 ? lerpHex(baseTop, targetTop, blend) : baseTop;

        const baseGrid = cur.gridAccent || baseTheme.gridV;
        const targetGrid = (nxt && nxt.gridAccent) ? nxt.gridAccent : baseGrid;
        const gridV = blend > 0 ? lerpHex(baseGrid, targetGrid, blend) : baseGrid;

        return { skyTop, gridV };
      }

      function getNextMilestone(currentMeters) {
        const fixed = [100, 250, 500, 750, 1000];
        for (let i = 0; i < fixed.length; i++) {
          if (currentMeters < fixed[i]) return fixed[i];
        }
        return (Math.floor(currentMeters / 500) + 1) * 500;
      }

      function computeVisualMultiplier(streak) {
        return Math.min(1.85, 1 + Math.floor(streak / 3) * 0.05);
      }

      function getSortedLeaderboard() {
        const list = appData.leaderboard.map((item) => ({ ...item }));
        const alias = (appData.settings.playerName || "").trim();
        if (alias) {
          const existing = list.find((p) => p.id === "local_player");
          if (existing) {
            existing.name = alias;
            existing.totalScore = appData.stats.totalScore;
            existing.bestRun = appData.stats.bestRunDistance;
            existing.games = appData.stats.gamesPlayed;
          } else {

              id: "local_player",
              name: alias,
              totalScore: appData.stats.totalScore,
              bestRun: appData.stats.bestRunDistance,
              games: appData.stats.gamesPlayed
            });
          }
        }
        return list.sort((a, b) => b.totalScore - a.totalScore || b.bestRun - a.bestRun);
      }

      function executeJump() {

        game.grounded = false;
        game.fastFalling = false;

        soundEngine.sfxJump();

      function requestJump() {
        const now = performance.now();
        if (now - lastJumpStamp < 55) return;
        lastJumpStamp = now;
        if (!game || uiState.screen !== "game" || uiState.paused || uiState.gameOver || uiState.resumeCountdown > 0) return;
        if (game.grounded) {
          executeJump();
        } else {
          game.jumpBuffer = 0.14;
        }
      }

      function requestFastFall() {
        if (!game || uiState.screen !== "game" || uiState.paused || uiState.gameOver || uiState.resumeCountdown > 0) return;
        if (!game.grounded && !game.fastFalling) {
          game.fastFalling = true;
          game.vy = Math.max(game.vy + 540, 640);
          triggerVibrate(10);
        }
      }

      function beginResumeCountdown() {
        if (uiState.resumeCountdown > 0) return;
        uiState.paused = false;
        uiState.resumeCountdown = 3;
        renderApp();
        if (resumeInterval) clearInterval(resumeInterval);
        resumeInterval = setInterval(() => {
          uiState.resumeCountdown--;
          if (uiState.resumeCountdown <= 0) {
            uiState.resumeCountdown = 0;
            clearInterval(resumeInterval);
            resumeInterval = null;
          }
          renderApp();
        }, 550);
      }

      function updateSessionMissions() {
        if (!game) return;
        let changed = false;
        appData.missions.forEach((m) => {
          let val = m.current;
          if (m.id === "m_dist") val = Math.max(m.current, game.meters);
          else if (m.id === "m_streak") val = Math.max(m.current, game.streak);
          else if (m.id === "m_coins") val = Math.max(m.current, game.coinCount);
          if (val !== m.current) {
            m.current = val;
            changed = true;
          }
          if (!m.claimed && m.current >= m.target) {
            m.claimed = true;
            appData.coinsBalance += m.reward;
            appData.stats.totalCoinsEarned += m.reward;
            changed = true;
            soundEngine.sfxCoin();
            triggerBanner("MISIÓN CUMPLIDA", `+${m.reward} monedas para Tienda`, GOLD);
          }
        });
        if (changed) {
          persistData();
          updateGameHudDOM();
        }
      }

      function finalizeGameOver() {
        if (!game || game.finished) return;
        game.finished = true;
        uiState.gameOver = true;
        soundEngine.sfxLose();

        const finalMeters = game.meters;
        const coinsEarned = game.coinCount + game.bonusCoins;
        const beatRecord = finalMeters > (appData.stats.bestRunDistance || 0);

        appData.stats.gamesPlayed += 1;
        appData.stats.totalScore += finalMeters;
        appData.coinsBalance += coinsEarned;
        appData.stats.totalCoinsEarned += coinsEarned;
        if (beatRecord) {
          appData.stats.bestRunDistance = finalMeters;
        }

        uiState.isNewRecordRun = beatRecord;
        uiState.lastRunSummary = {
          distance: finalMeters,
          score: finalMeters,
          coins: coinsEarned,
          collectedCoins: game.coinCount,
          bonusCoins: game.bonusCoins,
          totalAccumulated: appData.stats.totalScore
        };

        persistData();
        renderApp();
      }

      function startLoop() {
        if (rafId) cancelAnimationFrame(rafId);
        lastFrameTime = performance.now();
        fpsFrames = 0;
        fpsAccum = 0;

        function tick(now) {
          if (uiState.screen !== "game" || !game) return;
          rafId = requestAnimationFrame(tick);

          const rawDt = Math.max(0, (now - lastFrameTime) / 1000);
          lastFrameTime = now;
          const dt = Math.min(0.05, rawDt);

          if (rawDt > 0) {
            fpsFrames++;
            fpsAccum += rawDt;
            if (fpsAccum >= 0.35) {
              currentFps = Math.max(1, Math.min(240, Math.round(fpsFrames / fpsAccum)));
              fpsFrames = 0;
              fpsAccum = 0;
            }
          }

          const stepScale = dt * 60;
          const theme = getActiveTheme();
          const skin = getActiveSkin();

          if (!uiState.paused && !uiState.gameOver && !document.hidden && uiState.resumeCountdown === 0) {
            if (game.hitstopTimer > 0) {
              game.hitstopTimer = Math.max(0, game.hitstopTimer - dt);
              if (game.shake > 0) game.shake = Math.max(0, game.shake - stepScale);
            } else {
              game.frame++;
              game.elapsed += dt;

              // Velocidad progresiva suave
              const diffProgress = Math.min(1, game.elapsed / 150);
              game.speedMult = 1 + diffProgress * 0.78;
              game.speed = game.baseSpeed * game.speedMult;

              const dx = game.speed * dt;
              game.rawDist += dx * 0.14;
              game.meters = Math.floor(game.rawDist);

              // Hitos de distancia
              if (game.meters >= game.nextMilestone) {
                const reached = game.nextMilestone;
                triggerBanner(`HITO ${reached}m`, "Meta de torneo alcanzada", theme.accent);
                game.nextMilestone = getNextMilestone(reached);
              }

              // Récord personal en vivo
              if (game.prevBestAtStart > 0 && !game.liveRecordBeat && game.meters > game.prevBestAtStart) {
                game.liveRecordBeat = true;
                game.recordMarkerPassed = true;
                triggerBanner("★ RÉCORD EN VIVO", `Superaste ${game.prevBestAtStart}m`, GOLD);
              }

              if (game.bannerTimer > 0) game.bannerTimer = Math.max(0, game.bannerTimer - stepScale);
              if (game.jumpBuffer > 0) game.jumpBuffer = Math.max(0, game.jumpBuffer - dt);

              // Física vertical (salto + fast-fall)
              const gravity = game.fastFalling ? 5700 : 3168;
              game.vy += gravity * dt;
              game.y += game.vy * dt;
              if (game.y >= 380) {
                game.y = 380;
                game.vy = 0;
                game.grounded = true;
                game.fastFalling = false;
                if (game.jumpBuffer > 0) executeJump();
              }

              // Estela dinámica vinculada a la racha
              game.trail.unshift({ y: game.y + 17 });
              const maxTrail = game.streak >= 20 ? 11 : (game.streak >= 10 ? 8 : 6);
              if (game.trail.length > maxTrail) game.trail.length = maxTrail;
              for (let i = 0; i < game.trail.length; i++) {
                game.trail[i].x = 75 - (i + 1) * 7.2;
              }

              if (game.invuln > 0) game.invuln = Math.max(0, game.invuln - stepScale);
              if (game.hitFlash > 0) game.hitFlash = Math.max(0, game.hitFlash - stepScale);

              game.shockwaves.forEach((sw) => {
                sw.r += 180 * dt;
                sw.life -= dt;
              });
              game.shockwaves = game.shockwaves.filter((sw) => sw.life > 0);

              // Generación de obstáculos (incluye oscilantes suaves a partir de 400m+)
              game.nextObs -= dx;
              if (game.nextObs <= 0) {
                const coinConflict = game.coins.some((c) => !c.taken && c.x > 220 && c.x < 560);
                if (coinConflict) {
                  // Nunca introducir un obstáculo en medio de una ruta de monedas.
                  game.nextObs = Math.max(75, (game.speed / 60) * 13);
                } else {
                  const pal1 = OBS_PALETTES[Math.floor(Math.random() * OBS_PALETTES.length)];
                  const pal2 = OBS_PALETTES[Math.floor(Math.random() * OBS_PALETTES.length)];
                  const roll = Math.random();
                  const canOscillate = game.meters >= 400 && Math.random() < 0.35;

                  if (diffProgress < 0.15 || roll < 0.55) {
                    const isSpike = Math.random() > 0.45;
                    const w = isSpike ? (26 + Math.random() * 14) : (24 + Math.random() * 18);
                    const baseH = 38 + Math.random() * 32;
                    game.obstacles.push({
                      x: 380,
                      w,
                      baseH,
                      h: baseH,
                      spike: isSpike,
                      pal: pal1,
                      passed: false,
                      oscillate: canOscillate,
                      oscPhase: Math.random() * Math.PI * 2
                    });
                  } else if (roll < 0.82) {
                    const h1 = 34 + Math.random() * 18;
                    const h2 = 42 + Math.random() * 24;
                    const gap = 28 + Math.random() * 18;
                    game.obstacles.push(
                      { x: 380, w: 24, baseH: h1, h: h1, spike: Math.random() > 0.5, pal: pal1, passed: false, oscillate: false, oscPhase: 0 },
                      { x: 380 + gap, w: 26, baseH: h2, h: h2, spike: Math.random() > 0.4, pal: pal2, passed: false, oscillate: canOscillate, oscPhase: 1.2 }
                    );
                  } else {
                    const baseH = 42 + Math.random() * 20;
                    game.obstacles.push({
                      x: 380,
                      w: 30,
                      baseH,
                      h: baseH,
                      spike: true,
                      pal: pal1,
                      passed: false,
                      oscillate: false,
                      oscPhase: 0
                    });
                    const variant = COIN_VARIANTS[Math.floor(Math.random() * COIN_VARIANTS.length)];
                    for (let j = 0; j < 3; j++) {
                      const arcY = 315 - Math.sin((j / 2) * Math.PI) * 26;
                      game.coins.push({
                        x: 365 + j * 30,
                        y: arcY,
                        taken: false,
                        variant,
                        spin: j * 0.4
                      });
                    }
                  }

                  // Separación mínima más generosa para que cada patrón sea legible y evitable.
                  const minGap = Math.max(225, 310 - diffProgress * 70);
                  game.nextObs = minGap + Math.random() * 105;
                }
              }

              // Generación de monedas (5 formas)
              game.nextCoin -= dx;
              if (game.nextCoin <= 0) {
                const blocked = game.obstacles.some((o) => o.x + o.w > 240 && o.x < 560);
                if (!blocked) {
                  const patternType = Math.floor(Math.random() * 4);
                  const variant = COIN_VARIANTS[Math.floor(Math.random() * COIN_VARIANTS.length)];
                  if (patternType === 0) {
                    for (let j = 0; j < 5; j++) {
                      const arc = Math.sin((j / 4) * Math.PI) * -42;
                      game.coins.push({ x: 380 + j * 30, y: 362 + arc, taken: false, variant, spin: j * 0.3 });
                    }
                  } else if (patternType === 1) {
                    for (let j = 0; j < 4; j++) {
                      game.coins.push({ x: 380 + j * 32, y: 374, taken: false, variant, spin: j * 0.3 });
                    }
                  } else if (patternType === 2) {
                    for (let j = 0; j < 4; j++) {
                      game.coins.push({ x: 380 + j * 32, y: 318, taken: false, variant, spin: j * 0.3 });
                    }
                  } else {
                    for (let j = 0; j < 5; j++) {
                      const vMix = COIN_VARIANTS[j % COIN_VARIANTS.length];
                      game.coins.push({
                        x: 380 + j * 30,
                        y: j % 2 === 0 ? 372 : 334,
                        taken: false,
                        variant: vMix,
                        spin: j * 0.5
                      });
                    }
                  }
                }
                game.nextCoin = 280 + Math.random() * 250;
              }

              // Movimiento de obstáculos y conteo de racha de esquivas
              game.obstacles.forEach((o) => {
                o.x -= dx;
                if (o.oscillate) {
                  o.oscPhase += 3.4 * dt;
                  o.h = Math.max(26, o.baseH + Math.sin(o.oscPhase) * 14);
                }
                if (!o.passed && o.x + o.w < 58) {
                  o.passed = true;
                  game.streak++;
                  // Cada cinco esquivas consecutivas otorgan una moneda extra.
                  if (game.streak % 5 === 0) {
                    const comboReward = Math.round(computeVisualMultiplier(game.streak));
                    game.bonusCoins += comboReward;
                    triggerBanner(`RACHA x${game.streak}`, `+${comboReward} MONEDA${comboReward > 1 ? "S" : ""} BONUS`, GOLD);
                    soundEngine.sfxCoin();
                  }
                }
              });

              // Magnetismo suave de monedas a racha 15+ (solo atrae monedas, no puntos)
              const magnetOn = game.streak >= 15;
              const shipX = 75;
              const shipY = game.y + 17;

              game.coins.forEach((c) => {
                if (magnetOn && !c.taken) {
                  const dxC = shipX - c.x;
                  const dyC = shipY - c.y;
                  const dist = Math.hypot(dxC, dyC);
                  if (dist < 140 && dist > 1) {
                    const pull = 290 * dt;
                    c.x += (dxC / dist) * pull;
                    c.y += (dyC / dist) * pull;
                  } else {
                    c.x -= dx;
                  }
                } else {
                  c.x -= dx;
                }
                c.spin += 4.8 * dt;
              });

              game.obstacles = game.obstacles.filter((o) => o.x > -60);
              game.coins = game.coins.filter((c) => c.x > -60);

              // Recolección de monedas
              game.coins.forEach((c) => {
                if (!c.taken && c.x + 12 > 58 && c.x - 12 < 92 && c.y + 12 > game.y && c.y - 12 < game.y + 34) {
                  c.taken = true;
                  game.coinCount++;
                  soundEngine.sfxCoin();
                  triggerVibrate(16);
                  for (let j = 0; j < 10; j++) {
                    game.parts.push({
                      x: c.x,
                      y: c.y,
                      vx: (Math.random() - 0.5) * 310,
                      vy: (Math.random() - 0.5) * 310,
                      life: 0.36,
                      maxLife: 0.36,
                      c: c.variant.fill
                    });
                  }
                }
              });

              // Colisiones con obstáculos (Hitstop 45ms + Onda Expansiva)
              if (game.invuln === 0) {
                game.obstacles.forEach((o) => {
                  if (game.invuln === 0 && 89 > o.x + 4 && 59 < o.x + o.w - 4 && game.y + 32 > 416 - o.h) {
                    game.hearts--;
                    game.streak = 0;
                    game.invuln = 90;
                    game.shake = 12;
                    game.hitFlash = 10;
                    game.hitstopTimer = 0.045;
                    game.shockwaves.push({
                      x: 75,
                      y: game.y + 17,
                      r: 10,
                      life: 0.36,
                      maxLife: 0.36,
                      c: o.pal.main
                    });
                    soundEngine.sfxHit();
                    triggerVibrate(105);
                    for (let j = 0; j < 14; j++) {
                      game.parts.push({
                        x: 75,
                        y: game.y + 16,
                        vx: (Math.random() - 0.5) * 360,
                        vy: (Math.random() - 0.5) * 360,
                        life: 0.4,
                        maxLife: 0.4,
                        c: o.pal.main
                      });
                    }
                    if (game.hearts <= 0) {
                      finalizeGameOver();
                    }
                  }
                });
              }

              game.parts.forEach((pt) => {
                pt.x += pt.vx * dt;
                pt.y += pt.vy * dt;
                pt.life -= dt;
              });
              game.parts = game.parts.filter((pt) => pt.life > 0);
              if (game.shake > 0) game.shake = Math.max(0, game.shake - stepScale);

              updateSessionMissions();
            }

            if (game.frame % 4 === 0) {
              updateGameHudDOM();
            }
          }

          renderGameCanvas(theme, skin);
        }

        rafId = requestAnimationFrame(tick);
      }

      // =========================================================================
      // 7. RENDERIZADO CANVAS 2D SYNTHWAVE (360x480)
      // =========================================================================
      function renderGameCanvas(theme, skin) {
        const canvas = document.getElementById("gameCanvas");
        if (!canvas || !game) return;
        const ctx = canvas.getContext("2d");
        const W = 360;
        const H = 480;
        const biome = getBiomeColors(game.meters, theme);

        ctx.save();
        if (game.shake > 0) {
          ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
        }

        // 1. Cielo degradado según tema + transición de bioma
        const skyGrad = ctx.createLinearGradient(0, 0, 0, 416);
        skyGrad.addColorStop(0, biome.skyTop);
        skyGrad.addColorStop(0.5, theme.skyMid);
        skyGrad.addColorStop(0.85, theme.skyLow);
        skyGrad.addColorStop(1, theme.skyHorizon);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // 2. Luna Outrun con cortes horizontales y brillo del tema activo
        ctx.save();
        const moonX = 272;
        const moonY = 98;
        const moonR = 38;
        const moonGrad = ctx.createLinearGradient(moonX, moonY - moonR, moonX, moonY + moonR);
        moonGrad.addColorStop(0, theme.moonTop);
        moonGrad.addColorStop(0.55, theme.moonMid);
        moonGrad.addColorStop(1, theme.moonBot);
        ctx.shadowColor = theme.moonGlow;
        ctx.shadowBlur = 24;
        ctx.fillStyle = moonGrad;
        ctx.beginPath();
        ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = theme.moonCut;
        for (let sy = moonY + 4; sy < moonY + moonR; sy += 7) {
          ctx.fillRect(moonX - moonR, sy, moonR * 2, 2.2);
        }
        ctx.restore();

        // 3. Estrellas parpadeantes
        game.stars.forEach((st) => {
          const alpha = 0.35 + 0.65 * Math.abs(Math.sin(game.elapsed * 2.2 + st.phase));
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // 4. Edificios lejanos en parallax
        const farScroll = (game.rawDist * 11) % 544;
        game.farBuildings.forEach((b) => {
          let bx = b.x - farScroll;
          if (bx + b.w < 0) bx += 544;
          const by = 416 - b.h;
          ctx.fillStyle = "rgba(10, 12, 30, 0.78)";
          ctx.fillRect(bx, by, b.w, b.h);
          ctx.strokeStyle = b.hue === CYAN ? "rgba(0, 240, 255, 0.25)" : "rgba(255, 46, 166, 0.25)";
          ctx.lineWidth = 1;
          ctx.strokeRect(bx + 0.5, by + 0.5, b.w - 1, b.h);
        });

        // 5. Edificios cercanos con ventanas encendidas
        const nearScroll = (game.rawDist * 22) % 546;
        game.nearBuildings.forEach((b) => {
          let bx = b.x - nearScroll;
          if (bx + b.w < 0) bx += 546;
          const by = 416 - b.h;
          ctx.fillStyle = "#080a1c";
          ctx.fillRect(bx, by, b.w, b.h);
          ctx.strokeStyle = b.accent;
          ctx.globalAlpha = 0.42;
          ctx.strokeRect(bx + 0.5, by + 0.5, b.w - 1, b.h);
          ctx.globalAlpha = 1;

          const padX = 7;
          const padY = 9;
          const cellW = (b.w - padX * 2) / b.cols;
          for (let r = 0; r < b.rows; r++) {
            for (let c = 0; c < b.cols; c++) {
              if ((r + c) % 2 === 0) {
                ctx.fillStyle = b.accent;
                ctx.globalAlpha = 0.35;
                ctx.fillRect(bx + padX + c * cellW + 2, by + padY + r * 12, Math.max(3, cellW - 5), 5);
              }
            }
          }
          ctx.globalAlpha = 1;
        });

        // 6. Suelo con rejilla synthwave en perspectiva
        ctx.fillStyle = theme.groundBg;
        ctx.fillRect(0, 416, W, 64);

        // Baliza fantasma de récord personal en el suelo
        if (game.prevBestAtStart > 0 && !game.recordMarkerPassed) {
          const deltaMeters = game.prevBestAtStart - game.meters;
          const markerX = 75 + (deltaMeters / 0.14);
          if (markerX >= -20 && markerX <= W + 24) {
            ctx.save();
            ctx.strokeStyle = GOLD;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(markerX, 344);
            ctx.lineTo(markerX, 416);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = GOLD;
            ctx.beginPath();
            ctx.moveTo(markerX, 344);
            ctx.lineTo(markerX + 18, 351);
            ctx.lineTo(markerX, 358);
            ctx.closePath();
            ctx.fill();

            ctx.font = "bold 9px 'Orbitron', system-ui, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`RÉCORD ${game.prevBestAtStart}m`, markerX, 336);
            ctx.restore();
          }
        }

        // Línea de horizonte brillante
        ctx.save();
        ctx.shadowColor = theme.horizonLine;
        ctx.shadowBlur = 12;
        ctx.fillStyle = theme.horizonLine;
        ctx.fillRect(0, 416, W, 3);
        ctx.restore();

        // Líneas horizontales de la rejilla
        ctx.strokeStyle = theme.gridH;
        ctx.lineWidth = 1;
        [428, 444, 464].forEach((gy) => {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(W, gy);
          ctx.stroke();
        });

        // Líneas diagonales en movimiento de la rejilla
        const gridOffset = (game.rawDist * 36) % 40;
        ctx.strokeStyle = biome.gridV;
        for (let gx = -40; gx <= W + 40; gx += 40) {
          const topX = gx - gridOffset;
          const botX = 180 + (topX - 180) * 1.45;
          ctx.beginPath();
          ctx.moveTo(topX, 418);
          ctx.lineTo(botX, H);
          ctx.stroke();
        }

        // 7. Monedas de 5 formas con brillo y reflejo interior
        game.coins.forEach((c) => {
          if (c.taken) return;
          const v = c.variant;
          const scaleX = 0.72 + 0.28 * Math.abs(Math.cos(c.spin));
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.scale(scaleX, 1);
          ctx.shadowColor = v.glow;
          ctx.shadowBlur = 12;
          ctx.fillStyle = v.fill;
          ctx.strokeStyle = v.stroke;
          ctx.lineWidth = 1.8;

          if (v.shape === "circle") {
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(-2.5, -2.5, 3.2, 0, Math.PI * 2);
            ctx.fill();
          } else if (v.shape === "hex") {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const ang = (i * Math.PI) / 3;
              const px = Math.cos(ang) * 10.5;
              const py = Math.sin(ang) * 10.5;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (v.shape === "diamond") {
            ctx.beginPath();
            ctx.moveTo(0, -11.5);
            ctx.lineTo(9.5, 0);
            ctx.lineTo(0, 11.5);
            ctx.lineTo(-9.5, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.moveTo(0, -5);
            ctx.lineTo(4, 0);
            ctx.lineTo(0, 5);
            ctx.lineTo(-4, 0);
            ctx.closePath();
            ctx.fill();
          } else if (v.shape === "star") {
            ctx.beginPath();
            for (let i = 0; i < 10; i++) {
              const r = i % 2 === 0 ? 11.5 : 5.2;
              const ang = (i * Math.PI) / 5 - Math.PI / 2;
              const px = Math.cos(ang) * r;
              const py = Math.sin(ang) * r;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = v.inner;
            ctx.beginPath();
            ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = theme.skyLow;
            ctx.beginPath();
            ctx.arc(0, 0, 4.4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });

        // 8. Obstáculos de colores neón con borde superior brillante
        game.obstacles.forEach((o) => {
          const topY = 416 - o.h;
          ctx.save();
          ctx.shadowColor = o.pal.glow;
          ctx.shadowBlur = 14;

          if (o.spike) {
            ctx.fillStyle = o.pal.main;
            ctx.beginPath();
            ctx.moveTo(o.x, 416);
            ctx.lineTo(o.x + o.w / 2, topY);
            ctx.lineTo(o.x + o.w, 416);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = o.pal.top;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = o.pal.stripe;
            ctx.beginPath();
            ctx.moveTo(o.x + o.w * 0.34, 416);
            ctx.lineTo(o.x + o.w / 2, topY + 10);
            ctx.lineTo(o.x + o.w * 0.66, 416);
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillStyle = o.pal.main;
            ctx.fillRect(o.x, topY, o.w, o.h);
            ctx.fillStyle = o.pal.top;
            ctx.fillRect(o.x, topY, o.w, 4);
            ctx.fillStyle = o.pal.stripe;
            ctx.globalAlpha = 0.45;
            ctx.fillRect(o.x + 4, topY + 10, o.w - 8, 4);
            ctx.globalAlpha = 1;
          }
          ctx.restore();
        });

        // 9. Estela dinámica vinculada a la racha de esquivas
        const isBlinkHidden = game.invuln > 0 && Math.floor(game.frame / 5) % 2 === 0;
        if (game.trail.length > 0 && !isBlinkHidden) {
          const trailColor = game.streak >= 10 ? skin.thruster : skin.body;
          for (let i = game.trail.length - 1; i >= 0; i--) {
            const tr = game.trail[i];
            const ratio = 1 - i / (game.trail.length + 1);
            const radius = (game.streak >= 15 ? 10.5 : 7.5) * ratio;
            ctx.save();
            ctx.globalAlpha = ratio * (game.streak >= 10 ? 0.38 : 0.22);
            ctx.fillStyle = trailColor;
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, Math.max(2, radius), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // 10. Nave del jugador (geometría exacta con paleta de la skin equipada)
        if (!isBlinkHidden) {
          const px = 75;
          const py = game.y + 17;
          ctx.save();
          ctx.translate(px, py);

          // Llama propulsora
          const flameLen = 10 + Math.sin(game.frame * 0.7) * 4;
          ctx.fillStyle = skin.thruster;
          ctx.shadowColor = skin.thruster;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(-16, -6);
          ctx.lineTo(-16 - flameLen, 0);
          ctx.lineTo(-16, 6);
          ctx.closePath();
          ctx.fill();

          // Fuselaje principal
          ctx.shadowColor = skin.body;
          ctx.shadowBlur = 15;
          ctx.fillStyle = skin.body;
          ctx.beginPath();
          ctx.moveTo(-16, -13);
          ctx.lineTo(18, 0);
          ctx.lineTo(-16, 13);
          ctx.lineTo(-10, 0);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;

          // Cabina y visor
          ctx.fillStyle = skin.cockpit;
          ctx.beginPath();
          ctx.moveTo(-5, -6);
          ctx.lineTo(9, 0);
          ctx.lineTo(-5, 6);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = skin.visor;
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-2, -3);
          ctx.lineTo(6, 0);
          ctx.stroke();

          ctx.restore();
        }

        // 11. Ondas expansivas al recibir daño
        game.shockwaves.forEach((sw) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.85;
          ctx.strokeStyle = sw.c || PINK;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        });

        // 12. Partículas
        game.parts.forEach((pt) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.fillStyle = pt.c;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        // 13. Banners flotantes dentro del canvas (Hitos y Récord en vivo)
        if (game.bannerTimer > 0 && game.bannerText) {
          const alpha = Math.min(1, game.bannerTimer / 18);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = "rgba(8, 10, 24, 0.84)";
          ctx.strokeStyle = game.bannerColor;
          ctx.lineWidth = 1.6;
          const bw = 240;
          const bh = game.bannerSub ? 46 : 32;
          const bx = (W - bw) / 2;
          const by = 44;
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, bh, 12);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = game.bannerColor;
          ctx.font = "800 13px 'Arial Black', system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(game.bannerText, W / 2, by + 20);

          if (game.bannerSub) {
            ctx.fillStyle = "#ffffff";
            ctx.font = "600 11px system-ui, sans-serif";
            ctx.fillText(game.bannerSub, W / 2, by + 36);
          }
          ctx.restore();
        }

        // Flash rojo suave al recibir impacto
        if (game.hitFlash > 0) {
          ctx.fillStyle = `rgba(255, 30, 86, ${(game.hitFlash / 32).toFixed(2)})`;
          ctx.fillRect(0, 0, W, H);
        }

        ctx.restore();
      }

      function updateGameHudDOM() {
        if (!game) return;
        const theme = getActiveTheme();
        const labelEl = document.getElementById("hud-dist-label");
        const scoreEl = document.getElementById("hud-score-val");
        const statsEl = document.getElementById("hud-streak-line");
        const heartsEl = document.getElementById("hud-hearts-row");
        const coinsEl = document.getElementById("hud-coins-val");
        const fpsEl = document.getElementById("hud-fps-val");
        const missionsEl = document.getElementById("hud-missions-grid");

        if (labelEl) {
          labelEl.textContent = game.liveRecordBeat ? "★ RÉCORD EN VIVO · 1m = 1pt" : "DISTANCIA / SCORE (1m = 1pt)";
          labelEl.style.color = game.liveRecordBeat ? GOLD : "rgba(255,255,255,0.6)";
        }
        if (scoreEl) {
          scoreEl.innerHTML = `${game.meters.toLocaleString()} <span style="font-size:12px;color:#fff;">pts</span>`;
          scoreEl.style.color = game.liveRecordBeat ? GOLD : theme.accent;
        }
        if (statsEl) {
          const mult = computeVisualMultiplier(game.streak).toFixed(2);
          const kmh = Math.round(36 * game.speedMult);
          const magnetTxt = game.streak >= 15 ? " · 🧲" : "";
          statsEl.textContent = `🔥 Racha ${game.streak} · x${mult} · Bonus +${game.bonusCoins} 🪙 · ${kmh} km/h${magnetTxt}`;
        }
        if (heartsEl) {
          heartsEl.innerHTML = [1, 2, 3].map((idx) =>
            `<span style="color:${idx <= game.hearts ? "#f87171" : "rgba(255,255,255,0.18)"};display:inline-flex;">${idx <= game.hearts ? ICONS.heartFull : ICONS.heartEmpty}</span>`
          ).join("");
        }
        if (coinsEl) {
          coinsEl.textContent = `🪙 +${game.coinCount + game.bonusCoins}`;
        }
        if (fpsEl) {
          fpsEl.textContent = `${currentFps} FPS`;
        }
        if (missionsEl) {
          missionsEl.innerHTML = renderMissionsHtml();
        }
      }

      function renderMissionsHtml() {
        return appData.missions.map((m) => {
          const cur = Math.min(m.target, m.current);
          return `
            <div style="padding:5px 7px;border-radius:11px;background:${m.claimed ? "rgba(110,231,183,0.14)" : "rgba(255,255,255,0.06)"};border:1px solid ${m.claimed ? "rgba(110,231,183,0.45)" : "rgba(255,255,255,0.1)"};font-size:10px;line-height:1.25;">
              <div style="font-weight:700;color:${m.claimed ? "#6ee7b7" : "#fff"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.title}</div>
              <div style="margin-top:2px;font-weight:700;color:${m.claimed ? "#6ee7b7" : GOLD};">${m.claimed ? `✓ +${m.reward} 🪙` : `${cur}/${m.target} · +${m.reward}🪙`}</div>
            </div>
          `;
        }).join("");
      }

      // =========================================================================
      // 8. RENDERIZADO DE PANTALLAS Y MODALES (DOM LIMPIO Y EXPLÍCITO)
      // =========================================================================
      function renderApp() {
        const root = document.getElementById("app");

                      <span>IR A TIENDA (${appData.coinsBalance} 🪙)</span>
                    </button>
                    <button id="btn-quit-menu" class="btn-outline">
                      ${ICONS.back}
                      <span>MENÚ PRINCIPAL</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }

          mainHtml = `
            <div style="display:flex;flex-direction:column;height:100%;gap:7px;">
              <div class="card" style="padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;">
                <div style="min-width:0;">
                  <div id="hud-dist-label" style="font-size:10px;font-weight:700;letter-spacing:0.06em;color:${game.liveRecordBeat ? GOLD : "rgba(255,255,255,0.6)"};">
                    ${game.liveRecordBeat ? "★ RÉCORD EN VIVO · 1m = 1pt" : "DISTANCIA / SCORE (1m = 1pt)"}
                  </div>
                  <div id="hud-score-val" class="font-display" style="font-size:22px;line-height:1.05;color:${game.liveRecordBeat ? GOLD : theme.accent};margin-top:1px;">
                    ${game.meters.toLocaleString()} <span style="font-size:12px;color:#fff;">pts</span>
                  </div>
                  <div id="hud-streak-line" style="font-size:10px;color:rgba(255,255,255,0.78);margin-top:2px;">
                    🔥 Racha ${game.streak} · x${mult} · Bonus +${game.bonusCoins} 🪙 · ${kmh} km/h${game.streak >= 15 ? " · 🧲" : ""}
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                  <div style="text-align:right;">
                    <div id="hud-hearts-row" style="display:flex;gap:2px;justify-content:flex-end;">${heartsHtml}</div>
                    <div id="hud-coins-val" style="font-size:11px;font-weight:800;color:${GOLD};margin-top:2px;">🪙 +${game.coinCount + game.bonusCoins}</div>
                    ${appData.settings.showFps ? `<div id="hud-fps-val" style="font-size:10px;font-weight:700;color:${theme.accent};margin-top:1px;">${currentFps} FPS</div>` : ""}
                  </div>
                  <button id="btn-pause-game" aria-label="Pausar" style="width:38px;height:38px;border-radius:50%;background:${theme.accent};color:#070c14;display:grid;place-items:center;">
                    ${ICONS.pause}
                  </button>
                </div>
              </div>

              <div id="hud-missions-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex-shrink:0;">
                ${renderMissionsHtml()}
              </div>

              <div class="canvas-wrap" style="border-color:${game.liveRecordBeat ? GOLD + "77" : "var(--line)"};">
                <canvas id="gameCanvas" width="360" height="480"></canvas>
                ${overlayHtml}
              </div>

              <div style="display:grid;grid-template-columns:1fr auto;gap:8px;flex-shrink:0;">
                <button id="btn-touch-jump" class="font-display" style="padding:15px;border-radius:18px;font-size:19px;font-weight:900;background:linear-gradient(90deg, ${theme.accent}, ${theme.secondary});color:#070c14;">
                  ▲ SALTAR
                </button>
                <button id="btn-touch-fastfall" style="padding:15px 14px;border-radius:18px;font-size:13px;font-weight:800;background:rgba(255,255,255,0.12);border:1px solid var(--line);color:#fff;">
                  ▼ BAJAR
                </button>
              </div>
            </div>
          `;
        }

        // -----------------------------------------------------------------------
        // MODALES GLOBALES (ALIAS DE JUGADOR Y SALIDA DIRECTA)
        // -----------------------------------------------------------------------
        let globalModalHtml = "";
        if (uiState.aliasModalOpen) {
          globalModalHtml = `
            <div class="modal-global">
              <div class="card" style="width:100%;max-width:360px;padding:18px;">
                <div class="font-display" style="font-size:17px;color:${theme.accent};">ALIAS DE COMPETIDOR</div>
                <p style="font-size:12px;color:var(--muted);margin:6px 0 12px;line-height:1.4;">
                  Tu alias aparecerá en la tabla del Torneo $1000 y guardará tu puntuación acumulada offline.
                </p>
                <input id="input-player-alias" type="text" maxlength="18" placeholder="Ej. NeonRider_MX" value="${(appData.settings.playerName || "").replace(/"/g, "&quot;")}">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;">
                  <button id="btn-cancel-alias" class="btn-outline">Cancelar</button>
                  <button id="btn-save-alias" class="btn-primary">Guardar</button>
                </div>
              </div>
            </div>
          `;
        } else if (uiState.exitModalOpen) {
          globalModalHtml = `
            <div class="modal-global">
              <div class="card" style="width:100%;max-width:350px;padding:18px;text-align:center;">
                <div class="font-display" style="font-size:17px;color:#fca5a5;">¿SALIR DE DASH NEON PRO?</div>
                <p style="font-size:12.5px;color:var(--muted);margin:8px 0 16px;">Tu progreso, monedas y desbloqueos ya están guardados localmente.</p>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <button id="btn-cancel-exit" class="btn-outline">Cancelar</button>
                  <button id="btn-confirm-exit" class="btn-primary" style="background:#f87171;color:#070c14;">Salir</button>
                </div>
              </div>
            </div>
          `;
        }

        const toastHtml = uiState.toastMsg ? `<div class="toast-banner">${uiState.toastMsg}</div>` : "";

        root.innerHTML = `
          <header class="app-header">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              <div class="font-display" style="width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,${skin.body},${theme.secondary});color:#07101d;display:grid;place-items:center;flex-shrink:0;">${ICONS.ship.replace('width="30" height="30"','width="22" height="22"')}</div>
              <div style="min-width:0;">
                <div class="font-display" style="font-size:13px;line-height:1.1;color:#fff;">DASH NEON PRO</div>
                <div style="font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${theme.name}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              <div style="display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;background:rgba(255,225,77,0.14);border:1px solid rgba(255,225,77,0.38);color:${GOLD};font-size:11.5px;font-weight:800;">
                ${ICONS.coin}
                <span>${appData.coinsBalance.toLocaleString()}</span>
              </div>
              <button id="btn-header-alias" class="pill-btn" style="max-width:120px;">
                ${ICONS.user}
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${aliasText}</span>
              </button>
            </div>
          </header>

          <main class="app-main ${uiState.screen === "game" ? "game-mode" : ""}">
            ${mainHtml}
          </main>

          ${toastHtml}
          ${globalModalHtml}
        `;

        bindEvents();

        if (uiState.screen === "game" && game) {
          renderGameCanvas(theme, skin);
        }
      }

      // =========================================================================
      // 9. VINCULACIÓN SEGURA DE EVENTOS
      // =========================================================================
      function bindEvents() {
        const byId = (id) => document.getElementById(id);

        // Header alias
        const btnAlias = byId("btn-header-alias");
        if (btnAlias) {
          btnAlias.onclick = () => {
            uiState.aliasModalOpen = true;
            uiState.pendingPlayAfterAlias = false;
            renderApp();
          };
        }

        // Menú principal
        const btnPlay = byId("btn-play-main");
        if (btnPlay) {
          btnPlay.onclick = () => {
            if (!appData.settings.playerName || !appData.settings.playerName.trim()) {
              uiState.aliasModalOpen = true;
              uiState.pendingPlayAfterAlias = true;
              renderApp();
              return;
            }
            initGameSession();
          };
        }

        const btnTourney = byId("btn-open-tournament");
        if (btnTourney) btnTourney.onclick = () => { uiState.screen = "tournament"; renderApp(); };

        const btnShop = byId("btn-open-shop");
        if (btnShop) btnShop.onclick = () => { uiState.screen = "shop"; renderApp(); };

        const btnSettings = byId("btn-open-settings");
        if (btnSettings) btnSettings.onclick = () => { uiState.screen = "settings"; renderApp(); };

        const btnExit = byId("btn-open-exit");
        if (btnExit) btnExit.onclick = () => { uiState.exitModalOpen = true; renderApp(); };

        // Botones regresar al menú
        ["btn-back-menu", "btn-back-menu-bottom"].forEach((id) => {
          const el = byId(id);
          if (el) el.onclick = () => { uiState.screen = "menu"; renderApp(); };
        });

        // Pestañas de Tienda
        const tabSkins = byId("tab-shop-skins");
        if (tabSkins) tabSkins.onclick = () => { uiState.shopTab = "skins"; renderApp(); };

        const tabThemes = byId("tab-shop-themes");
        if (tabThemes) tabThemes.onclick = () => { uiState.shopTab = "themes"; renderApp(); };

        // Compra / Equipado de Skins
        document.querySelectorAll("[data-skin-id]").forEach((btn) => {
          btn.onclick = () => {
            const skinId = btn.getAttribute("data-skin-id");
            const sk = NEON_SKINS.find((s) => s.id === skinId);
            if (!sk) return;
            const unlocked = appData.settings.unlockedSkins.includes(sk.id);
            if (appData.settings.equippedSkin === sk.id) return;
            if (unlocked) {
              appData.settings.equippedSkin = sk.id;
              persistData();
              showToast(`Skin "${sk.name}" equipada.`);
              return;
            }
            if (appData.coinsBalance < sk.price) {
              showToast(`Te faltan ${sk.price - appData.coinsBalance} monedas.`);
              return;
            }
            appData.coinsBalance -= sk.price;
            appData.settings.unlockedSkins.push(sk.id);
            appData.settings.equippedSkin = sk.id;
            persistData();
            showToast(`¡Compraste y equipaste "${sk.name}"!`);
          };
        });

        // Compra / Aplicación de Temas de Interfaz (Comprar -> Aplicar -> Aplicado)
        document.querySelectorAll("[data-theme-id]").forEach((btn) => {
          btn.onclick = () => {
            const themeId = btn.getAttribute("data-theme-id");
            const th = INTERFACE_THEMES.find((t) => t.id === themeId);
            if (!th) return;
            const unlocked = appData.settings.unlockedThemes.includes(th.id);
            if (appData.settings.equippedTheme === th.id) return;
            if (unlocked) {
              appData.settings.equippedTheme = th.id;
              persistData();
              showToast(`Tema "${th.name}" aplicado.`);
              return;
            }
            if (appData.coinsBalance < th.price) {
              showToast(`Te faltan ${th.price - appData.coinsBalance} monedas.`);
              return;
            }
            appData.coinsBalance -= th.price;
            appData.settings.unlockedThemes.push(th.id);
            appData.settings.equippedTheme = th.id;
            persistData();
            showToast(`¡Compraste y aplicaste "${th.name}"!`);
          };
        });

        // Configuración
        const tMusic = byId("toggle-music");
        if (tMusic) {
          tMusic.onclick = () => {
            appData.settings.music = !appData.settings.music;
            persistData();
            if (appData.settings.music) soundEngine.startMusic();
            else soundEngine.stopMusic();
            renderApp();
          };
        }

        const tSfx = byId("toggle-sfx");
        if (tSfx) {
          tSfx.onclick = () => {
            appData.settings.sfx = !appData.settings.sfx;
            persistData();
            if (appData.settings.sfx) soundEngine.sfxCoin();
            renderApp();
          };
        }

        const rVol = byId("range-volume");
        if (rVol) {
          rVol.oninput = (e) => {
            appData.settings.volume = Number(e.target.value);
            persistData();
            renderApp();
          };
        }

        const tVib = byId("toggle-vibrate");
        if (tVib) {
          tVib.onclick = () => {
            appData.settings.vibration = !appData.settings.vibration;
            persistData();
            if (appData.settings.vibration) triggerVibrate(25);
            renderApp();
          };
        }

        const tFps = byId("toggle-fps");
        if (tFps) {
          tFps.onclick = () => {
            appData.settings.showFps = !appData.settings.showFps;
            persistData();
            renderApp();
          };
        }

        // Controles en Juego
        const canvas = byId("gameCanvas");
        if (canvas) {
          canvas.onpointerdown = (ev) => {
            swipeStartY = ev.clientY;
            requestJump();
          };
          canvas.onpointermove = (ev) => {
            if (swipeStartY === null) return;
            if (ev.clientY - swipeStartY > 28) {
              swipeStartY = null;
              requestFastFall();
            }
          };
          canvas.onpointerup = () => { swipeStartY = null; };
          canvas.onpointercancel = () => { swipeStartY = null; };
        }

        const btnJump = byId("btn-touch-jump");
        if (btnJump) btnJump.onpointerdown = () => requestJump();

        const btnFastFall = byId("btn-touch-fastfall");
        if (btnFastFall) btnFastFall.onpointerdown = () => requestFastFall();

        const btnPause = byId("btn-pause-game");
        if (btnPause) {
          btnPause.onclick = () => {
            if (uiState.resumeCountdown > 0 || uiState.gameOver) return;
            uiState.paused = true;
            renderApp();
          };
        }

        const btnResume = byId("btn-resume-game");
        if (btnResume) btnResume.onclick = () => beginResumeCountdown();

        const btnRestartPause = byId("btn-restart-pause");
        if (btnRestartPause) btnRestartPause.onclick = () => initGameSession();

        const btnPlayAgain = byId("btn-play-again");
        if (btnPlayAgain) btnPlayAgain.onclick = () => initGameSession();

        const btnGoShopOver = byId("btn-go-shop-over");
        if (btnGoShopOver) {
          btnGoShopOver.onclick = () => {
            if (rafId) cancelAnimationFrame(rafId);
            uiState.screen = "shop";
            renderApp();
          };
        }

        const btnQuitMenu = byId("btn-quit-menu");
        if (btnQuitMenu) {
          btnQuitMenu.onclick = () => {
            if (rafId) cancelAnimationFrame(rafId);
            uiState.paused = false;
            uiState.gameOver = false;
            uiState.screen = "menu";
            renderApp();
          };
        }

        // Modales globales
        const btnCancelAlias = byId("btn-cancel-alias");
        if (btnCancelAlias) {
          btnCancelAlias.onclick = () => {
            uiState.aliasModalOpen = false;
            uiState.pendingPlayAfterAlias = false;
            renderApp();
          };
        }

        const btnSaveAlias = byId("btn-save-alias");
        if (btnSaveAlias) {
          btnSaveAlias.onclick = () => {
            const inp = byId("input-player-alias");
            const val = inp ? inp.value.trim() : "";
            if (!val) {
              showToast("Escribe un alias válido para continuar.");
              return;
            }
            appData.settings.playerName = val;
            persistData();
            uiState.aliasModalOpen = false;
            const shouldPlay = uiState.pendingPlayAfterAlias;
            uiState.pendingPlayAfterAlias = false;
            if (shouldPlay) {
              initGameSession();
            } else {
              showToast(`Alias "${val}" guardado.`);
            }
          };
        }

        const btnCancelExit = byId("btn-cancel-exit");
        if (btnCancelExit) {
          btnCancelExit.onclick = () => {
            uiState.exitModalOpen = false;
            renderApp();
          };
        }

        const btnConfirmExit = byId("btn-confirm-exit");
        if (btnConfirmExit) {
          btnConfirmExit.onclick = () => {
            soundEngine.stopMusic();
            uiState.exitModalOpen = false;
            try { window.close(); } catch (e) {}
            showToast("Sesión cerrada. Puedes cerrar la aplicación.");
          };
        }
      }

      // Controles por teclado
      window.addEventListener("keydown", (ev) => {
        if (ev.repeat) return;
        if (uiState.aliasModalOpen) {
          if (ev.code === "Enter") {
            const btn = document.getElementById("btn-save-alias");
            if (btn) btn.click();
          }
          return;
        }
        if (uiState.screen === "game") {
          if (ev.code === "Space" || ev.code === "ArrowUp" || ev.code === "KeyW") {
            ev.preventDefault();
            requestJump();
          } else if (ev.code === "ArrowDown" || ev.code === "KeyS") {
            ev.preventDefault();
            requestFastFall();
          } else if (ev.code === "KeyP" || ev.code === "Escape") {
            if (!uiState.gameOver && uiState.resumeCountdown === 0) {
              if (uiState.paused) beginResumeCountdown();
              else { uiState.paused = true; renderApp(); }
            }
          }
        }
      });

      // Inicialización inmediata
      renderApp();
    })();
  </script>
</body>
</html>
